/* ---------- order calculations ---------- */
// وزن العبوة بالجرام = جرام القطعة × حجم العبوة (لو متسجلين)، وإلا الوزن الصافي المكتوب
const unitGrams = it => (n(it.pieceG) && n(it.piecesPerPack)) ? n(it.pieceG)*n(it.piecesPerPack) : n(it.netWeightG);
function itemCalc(it){
  const cartons = n(it.cartons), price = n(it.pricePerCarton), upc = n(it.unitsPerCarton);
  const unitNetKg = unitGrams(it)/1000;
  const ctnNet = n(it.cartonNetKg) || round(unitNetKg*upc,3);
  const ctnGross = n(it.cartonGrossKg) || ctnNet;
  const ctnCbm = (n(it.cartonL)*n(it.cartonW)*n(it.cartonH))/1e6;
  const loaded = it.loadedCartons===''||it.loadedCartons==null ? cartons : n(it.loadedCartons);
  return { cartons, price, line: cartons*price, units: cartons*upc, netKg: cartons*ctnNet, grossKg: cartons*ctnGross, cbm: cartons*ctnCbm,
    ctnNet, ctnGross, ctnCbm, loaded, loadedUnits: loaded*upc, loadedNet: loaded*ctnNet, loadedGross: loaded*ctnGross, loadedCbm: loaded*ctnCbm, loadedLine: loaded*price };
}
function orderCalc(o){
  const items = (o.items||[]).map(it=>({it, c:itemCalc(it)}));
  const sub = sum(items,x=>x.c.line);
  const discBase = sum(items.filter(x=>x.it.onDiscount),x=>x.c.line);
  const disc = discBase*n(o.discountPct)/100;
  const total = sub - disc;
  const lsub = sum(items,x=>x.c.loadedLine), ldisc = sum(items.filter(x=>x.it.onDiscount),x=>x.c.loadedLine)*n(o.discountPct)/100;
  return { items, sub, disc, total, cartons: sum(items,x=>x.c.cartons), units: sum(items,x=>x.c.units),
    netKg: sum(items,x=>x.c.netKg), grossKg: sum(items,x=>x.c.grossKg), cbm: sum(items,x=>x.c.cbm),
    loaded: sum(items,x=>x.c.loaded), loadedNet: sum(items,x=>x.c.loadedNet), loadedGross: sum(items,x=>x.c.loadedGross), loadedCbm: sum(items,x=>x.c.loadedCbm),
    loadedTotal: lsub-ldisc, loadedSub:lsub, loadedDisc:ldisc };
}
function payCalc(o, payments){
  const calc = orderCalc(o);
  const ps = (payments||[]).filter(p=>p.orderId===o.id && !p.void);
  const conf = ps.filter(p=>p.confirmed && (p.currency||o.currency)===(o.currency||'USD'));
  const paid = sum(conf,p=>p.amount);
  const pending = sum(ps.filter(p=>!p.confirmed),p=>p.amount);
  const other = ps.filter(p=>p.confirmed && (p.currency||o.currency)!==(o.currency||'USD'));
  const total = calc.total;
  const depositReq = total*n(o.depositPct ?? 50)/100;
  return { total, paid, pending, remaining: Math.max(0,total-paid), depositReq, depositOk: total>0 && paid+0.005>=depositReq, fullOk: total>0 && paid+0.005>=total, pct: total? Math.min(100,paid/total*100):0, otherCur: other.length };
}
function containerEstimate(rows, type){
  // rows: [{L,W,H (cm), kg (gross per carton), qty}]
  const c = CONTAINERS[type];
  const out = rows.map(r=>{
    const dims=[n(r.L),n(r.W),n(r.H)]; let best=0;
    if(dims.every(x=>x>0)){
      const perms=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];
      perms.forEach(p=>{ const fit=Math.floor(c.L/dims[p[0]])*Math.floor(c.W/dims[p[1]])*Math.floor(c.H/dims[p[2]]); if(fit>best) best=fit; });
    }
    const byWeight = n(r.kg)>0 ? Math.floor(c.kg/n(r.kg)) : Infinity;
    const cbm = dims[0]*dims[1]*dims[2]/1e6;
    return {...r, maxAlone: Math.min(best, byWeight), byWeight, cbmEach:cbm, cbm: cbm*n(r.qty), kgTot: n(r.kg)*n(r.qty)};
  });
  const cbm = sum(out,x=>x.cbm), kg = sum(out,x=>x.kgTot);
  const fillVol = cbm / c.cbmPractical * 100, fillKg = kg / c.kg * 100;
  // single-item exact-ish share: sum(qty/maxAlone)
  const share = out.every(x=>x.maxAlone>0) ? sum(out,x=>n(x.qty)/x.maxAlone)*100 : null;
  const fill = Math.max(fillVol, fillKg, share||0);
  return { rows: out, cbm, kg, fillVol, fillKg, share, fill, containers: Math.max(1,Math.ceil(fill/100)) };
}

/* ---------- order gates ---------- */
function gateBlockers(o, target, ctx){
  const b = []; const calc = orderCalc(o); const pay = payCalc(o, ctx.payments);
  const idx = FLOW.indexOf(target);
  if(idx >= FLOW.indexOf('quoted')){
    if(!o.customerId) b.push(t('g_customer'));
    if(!(o.items||[]).length) b.push(t('g_items'));
    if((o.items||[]).some(it=>!n(it.cartons)||!n(it.pricePerCarton))) b.push(t('g_qty_price'));
  }
  if(idx >= FLOW.indexOf('production')){
    if(!pay.depositOk) b.push(t('g_deposit')+` (${money(pay.paid,o.currency)} / ${money(pay.depositReq,o.currency)})`);
  }
  if(idx >= FLOW.indexOf('ready')){
    if((o.items||[]).some(it=>!it.batch||!it.prodDate)) b.push(t('g_batches'));
  }
  if(idx >= FLOW.indexOf('loaded')){
    if(!pay.fullOk) b.push(t('g_full_pay')+` (${money(pay.paid,o.currency)} / ${money(pay.total,o.currency)})`);
    const sh = o.shipment||{};
    if(o.incoterm!=='EXW' && !sh.bookingNo) b.push(t('g_booking'));
    if(!sh.containerNo) b.push(t('g_container'));
    if(!sh.sealNo) b.push(t('g_seal'));
    if(o.incoterm!=='EXW' && !n(sh.vgmKg)) b.push(t('g_vgm'));
  }
  if(idx >= FLOW.indexOf('shipped')){
    const sh = o.shipment||{};
    if(o.incoterm!=='EXW' && !sh.blNo) b.push(t('g_bl'));
    const req = requiredDocs(o, ctx.countries);
    const missing = req.filter(k=>{ const d=(o.docs||{})[k]||{}; return !['done','na'].includes(d.status); });
    if(missing.length) b.push(t('g_docs')+': '+missing.map(k=>t('doc_'+k)).join('، '));
  }
  if(idx >= FLOW.indexOf('delivered')){
    if(!(o.shipment||{}).docsReleased) b.push(t('g_released'));
  }
  return b;
}
function countryOf(o, countries){ const c=(o.customer||{}).country||''; return (countries||[]).find(x=>[x.name,x.nameAr].map(s=>String(s||'').trim().toLowerCase()).includes(c.trim().toLowerCase())); }
function requiredDocs(o, countries){ const c = countryOf(o,countries); const base = c && c.requiredDocs && c.requiredDocs.length ? c.requiredDocs : DEFAULT_REQ_DOCS; const extra = Object.keys(o.docs||{}).filter(k=>(o.docs[k]||{}).required); return [...new Set([...base, ...extra])]; }

/* ---------- product tests ---------- */
function testStatus(tst, settings){
  const until = tst.validUntil || (tst.testDate ? (()=>{const d=new Date(tst.testDate+'T00:00:00'); d.setDate(d.getDate()+n((settings||{}).testValidityDays||180)); return d.toISOString().slice(0,10);})() : '');
  const d = daysUntil(until);
  return { until, days:d, state: !until ? 'unknown' : d<0 ? 'expired' : d<=30 ? 'soon' : 'valid' };
}
function bestTests(productId, tests, settings){
  const mine = (tests||[]).filter(x=>x.productId===productId);
  const pick = kind => mine.filter(x=>x.kind===kind).map(x=>({x, s:testStatus(x,settings)})).sort((a,b)=> (b.s.until||'').localeCompare(a.s.until||''))[0] || null;
  return { cert: pick('test_cert'), lab: pick('lab_result'), all: mine };
}

/* One API for both modes:
   - demo: IndexedDB in this browser
   - firebase: Firestore (files stored as chunks in Firestore, so no Storage/Blaze plan is needed) */
const FB = {};
const DB = {
  mode: IS_DEMO ? 'local' : 'firebase',
  async init(){
    if(this.mode==='local') return LocalDB.open();
    const v = CFG.firebaseSdkVersion || '10.12.2', base = `https://www.gstatic.com/firebasejs/${v}/`;
    const [app, auth, fs] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')]);
    FB.app = app.initializeApp(CFG.firebase); FB.authMod = auth; FB.fs = fs;
    FB.auth = auth.getAuth(FB.app); FB.db = fs.getFirestore(FB.app);
  },
  async all(col, force){
    if(S.cache[col] && !force) return S.cache[col];
    let rows;
    if(this.mode==='local') rows = await LocalDB.all(col);
    else { const snap = await FB.fs.getDocs(FB.fs.collection(FB.db, col)); rows = snap.docs.map(d=>({id:d.id, ...d.data()})); }
    S.cache[col] = rows; return rows;
  },
  async where(col, field, val){
    if(this.mode==='local') return (await LocalDB.all(col)).filter(x=>x[field]===val);
    const q = FB.fs.query(FB.fs.collection(FB.db,col), FB.fs.where(field,'==',val));
    const snap = await FB.fs.getDocs(q); return snap.docs.map(d=>({id:d.id,...d.data()}));
  },
  async get(col, id){
    let r;
    if(this.mode==='local') r = await LocalDB.get(col,id);
    else { const d = await FB.fs.getDoc(FB.fs.doc(FB.db,col,id)); r = d.exists()? {id:d.id,...d.data()} : null; }
    if(r) this._put(col,r); return r;
  },
  async add(col, data){
    const id = uid(); const rec = {...data, createdAt: data.createdAt||nowISO(), createdBy: data.createdBy||who()};
    await this.set(col, id, rec); return id;
  },
  async set(col, id, data){
    const rec = clean({...data, updatedAt: nowISO(), updatedBy: who()}); delete rec.id;
    if(this.mode==='local') await LocalDB.put(col,id,rec);
    else await FB.fs.setDoc(FB.fs.doc(FB.db,col,id), rec);
    this._put(col,{id,...rec}); return id;
  },
  async update(col, id, patch){
    const p = clean({...patch, updatedAt: nowISO(), updatedBy: who()}); delete p.id;
    if(this.mode==='local'){ const cur = await LocalDB.get(col,id)||{}; await LocalDB.put(col,id,{...cur,...p}); }
    else await FB.fs.updateDoc(FB.fs.doc(FB.db,col,id), p);
    const c = byId(S.cache[col],id); if(c) Object.assign(c,p);
  },
  async del(col, id){
    if(this.mode==='local') await LocalDB.del(col,id);
    else await FB.fs.deleteDoc(FB.fs.doc(FB.db,col,id));
    if(S.cache[col]) S.cache[col] = S.cache[col].filter(x=>x.id!==id);
  },
  async next(key){ // atomic counter
    if(this.mode==='local'){ const c = await LocalDB.get('counters',key)||{v:0}; c.v=n(c.v)+1; await LocalDB.put('counters',key,c); return c.v; }
    const ref = FB.fs.doc(FB.db,'counters',key);
    return FB.fs.runTransaction(FB.db, async tx=>{ const d = await tx.get(ref); const v = (d.exists()? n(d.data().v):0)+1; tx.set(ref,{v}); return v; });
  },
  _put(col, r){ if(!S.cache[col]) return; const i = S.cache[col].findIndex(x=>x.id===r.id); if(i>-1) S.cache[col][i]=r; else S.cache[col].push(r); },
};
const who = () => S.profile ? (S.profile.name||S.profile.email||'') : '';
function clean(o){ if(Array.isArray(o)) return o.map(clean); if(o && typeof o==='object'){ const r={}; for(const k in o){ if(o[k]!==undefined) r[k]=clean(o[k]); } return r; } return o; }

/* ---------- IndexedDB (demo mode) ---------- */
const LocalDB = {
  db:null,
  open(){ return new Promise((res,rej)=>{ const r = indexedDB.open('egf_export',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{this.db=r.result;res()}; r.onerror=()=>rej(r.error); }); },
  tx(mode){ return this.db.transaction('kv',mode).objectStore('kv'); },
  req(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  get(col,id){ return this.req(this.tx('readonly').get(col+'/'+id)).then(v=>v? {id,...v}:null); },
  put(col,id,v){ const c={...v}; delete c.id; return this.req(this.tx('readwrite').put(c, col+'/'+id)); },
  del(col,id){ return this.req(this.tx('readwrite').delete(col+'/'+id)); },
  all(col){ return new Promise((res,rej)=>{ const out=[]; const r = this.tx('readonly').openCursor(IDBKeyRange.bound(col+'/', col+'/￿'));
    r.onsuccess=()=>{ const c=r.result; if(c){ out.push({id:String(c.key).slice(col.length+1), ...c.value}); c.continue(); } else res(out); }; r.onerror=()=>rej(r.error); }); },
  async wipe(){ return this.req(this.tx('readwrite').clear()); }
};

/* ---------- files (chunked in Firestore / IndexedDB) ---------- */
const CHUNK = 700*1024; const MAX_FILE = 9*1024*1024;
const FILES = {
  async upload(file, ref={}){
    if(file.size > MAX_FILE) throw new Error(t('file_too_big'));
    const b64 = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]||''); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(file); });
    const parts = Math.max(1, Math.ceil(b64.length/CHUNK));
    const id = uid();
    for(let i=0;i<parts;i++) await DB.set('file_chunks', id+'_'+i, {fileId:id, i, data: b64.slice(i*CHUNK,(i+1)*CHUNK)});
    await DB.set('files', id, {name:file.name, type:file.type||'application/octet-stream', size:file.size, parts, ref, uploadedAt:nowISO(), uploadedBy:who()});
    if(S.cache.file_chunks) delete S.cache.file_chunks;
    return id;
  },
  async meta(id){ return byId(S.cache.files,id) || DB.get('files',id); },
  async blob(id){
    const m = await this.meta(id); if(!m) throw new Error(t('file_missing'));
    let s=''; for(let i=0;i<m.parts;i++){ const c = await DB.get('file_chunks', id+'_'+i); s += c? c.data : ''; }
    const bin = atob(s); const arr = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return {blob:new Blob([arr],{type:m.type}), meta:m};
  },
  async open(id){ try{ const {blob} = await this.blob(id); const url=URL.createObjectURL(blob); window.open(url,'_blank'); setTimeout(()=>URL.revokeObjectURL(url),60000); }catch(e){ errToast(e); } },
  async download(id){ try{ const {blob,meta} = await this.blob(id); saveBlob(blob, meta.name); }catch(e){ errToast(e); } },
  async remove(id){ const m = await this.meta(id); if(m){ for(let i=0;i<m.parts;i++) await DB.del('file_chunks', id+'_'+i); } await DB.del('files', id); },
};
function saveBlob(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000); }
function pickFile(accept='.pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx'){ return new Promise(res=>{ const i=document.createElement('input'); i.type='file'; i.accept=accept; i.onchange=()=>res(i.files[0]||null); i.click(); }); }
async function filePill(id){ if(!id) return ''; const m = byId(S.cache.files,id); return `<span class="file-pill" onclick="FILES.open('${id}')" title="${esc(m?m.name:'')}">${IC.file}<span>${esc(m?m.name:t('file'))}</span></span>`; }
const filePillSync = id => { if(!id) return ''; const m = byId(S.cache.files,id); return `<span class="file-pill" onclick="FILES.open('${id}')" title="${esc(m?m.name:'')}">${IC.file}<span>${esc(m?m.name:t('file'))}</span></span>`; };

/* ---------- auth ---------- */
const AUTH = {
  async start(onReady){
    if(DB.mode==='local'){
      let p = null; try{ p = JSON.parse(localStorage.getItem('egf_demo_user')||'null'); }catch(e){}
      if(p){ S.user={uid:'demo'}; S.profile=p; }
      return onReady();
    }
    FB.authMod.onAuthStateChanged(FB.auth, async u=>{
      S.user = u; S.profile = null;
      if(u){
        try{
          let p = await DB.get('users', u.uid);
          const isAdminEmail = (CFG.adminEmails||[]).map(x=>x.toLowerCase()).includes((u.email||'').toLowerCase());
          if(!p){ p = {name: u.displayName || u.email.split('@')[0], email:u.email, role: isAdminEmail?'admin':'pending', active: isAdminEmail};
            await DB.set('users', u.uid, p); p.id=u.uid; }
          else if(isAdminEmail && (p.role!=='admin' || !p.active)){ await DB.update('users',u.uid,{role:'admin',active:true}); p.role='admin'; p.active=true; }
          S.profile = p;
        }catch(e){ errToast(e); }
      }
      onReady();
    });
  },
  async login(email, pass){
    if(DB.mode==='local'){ const p={id:'demo',name:email||'Demo Admin',email:'demo@local',role:'admin',active:true}; localStorage.setItem('egf_demo_user',JSON.stringify(p)); S.user={uid:'demo'}; S.profile=p; return; }
    await FB.authMod.signInWithEmailAndPassword(FB.auth, email, pass);
  },
  async signup(name, email, pass){
    const cred = await FB.authMod.createUserWithEmailAndPassword(FB.auth, email, pass);
    await FB.authMod.updateProfile(cred.user,{displayName:name});
    const isAdminEmail = (CFG.adminEmails||[]).map(x=>x.toLowerCase()).includes(email.toLowerCase());
    await DB.set('users', cred.user.uid, {name, email, role: isAdminEmail?'admin':'pending', active:isAdminEmail});
  },
  async reset(email){ await FB.authMod.sendPasswordResetEmail(FB.auth, email); },
  async logout(){ if(DB.mode==='local'){ localStorage.removeItem('egf_demo_user'); location.reload(); return; } await FB.authMod.signOut(FB.auth); location.hash=''; }
};

async function route(){

const fileField = (label, name, cur) => `<div class="field" data-file="${name}" data-cur="${cur||''}"><label>${label}</label>
  <div class="row wrap"><span class="ff-cur">${cur?filePillSync(cur):`<span class="faint small">${t('no_file')}</span>`}</span>
  <button type="button" class="btn btn-o btn-s" onclick="pickInto(this)">${IC.upload} ${t('choose_file')}</button></div></div>`;
async function pickInto(btn){ const f = await pickFile(); if(!f) return; const w = btn.closest('[data-file]'); w._file = f; w.querySelector('.ff-cur').innerHTML = `<span class="file-pill">${IC.file}<span>${esc(f.name)}</span></span> <span class="bdg b-yel nodot">${t('will_upload')}</span>`; }
async function saveFileField(root, name, ref){ const w = root.querySelector(`[data-file="${name}"]`); if(!w) return ''; if(w._file){ return FILES.upload(w._file, ref); } return w.dataset.cur||''; }

    const admin = S.profile.role==='admin';
    const bg = openModal({title:t('cant_move')+': '+t('st_'+target), body:`<div class="alert al-warn mb">${IC.alert}<div>${t('blockers_intro')}</div></div><ul style="padding-inline-start:20px;display:flex;flex-direction:column;gap:6px">${bl.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`,

    const ov=bg.querySelector('#ov'); if(ov) ov.onclick = async ()=>{ const r = await promptBox(t('override_reason')); if(!r) return; closeModal(bg); doAdvance(target, `${t('override')}: ${r}`); };
    return;
  }

async function doAdvance(target, note){
  const o=OD.o; const patch={status:target};
  if(target==='confirmed'){ if(!o.piNumber) patch.piNumber='PI-'+o.number; if(!o.piDate) patch.piDate=todayISO(); }
  if(target==='production') patch.production={...(o.production||{}), startedAt:(o.production||{}).startedAt||todayISO()};
  if(target==='ready') patch.production={...(o.production||{}), ...(patch.production||{}), finishedAt:todayISO()};
  if(target==='loaded') patch.shipment={...o.shipment, loadedAt:o.shipment.loadedAt||todayISO()};
  if(target==='shipped') patch.shipment={...o.shipment, ...(patch.shipment||{}), shippedAt:o.shipment.shippedAt||todayISO()};
  try{ await saveOrder(patch, `${t('h_status')}: ${t('st_'+target)}${note?' — '+note:''}`); toast(t('saved'),'ok'); renderOrder(); }catch(e){ errToast(e); }
}

  const bg = openModal({title:t('more'), size:'sm', body:`<div class="stack">
    ${can('orders.edit')?`<button class="btn btn-o" id="m-edit">${IC.edit} ${t('edit_header')}</button>`:''}
    ${admin?`<div class="field"><label>${t('set_status_admin')}</label><select class="in" id="m-st">${[...FLOW,'cancelled'].map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${t('st_'+s)}</option>`).join('')}</select></div><button class="btn btn-o" id="m-st-go">${t('apply')}</button>`:''}
    ${can('orders.edit')&&o.status!=='cancelled'?`<button class="btn btn-o" id="m-dup">${IC.copy} ${t('duplicate')}</button><button class="btn btn-d" id="m-cancel">${IC.x} ${t('cancel_order')}</button>`:''}
    ${admin?`<button class="btn btn-d" id="m-del">${IC.trash} ${t('delete_order')}</button>`:''}</div>`});
  const on=(id,f)=>{ const b=bg.querySelector('#'+id); if(b) b.onclick=f; };
  on('m-edit',()=>{ closeModal(bg); editHeader(); });
  on('m-st-go',async ()=>{ const s=bg.querySelector('#m-st').value; closeModal(bg); await saveOrder({status:s},`${t('h_status')}: ${t('st_'+s)} (${t('manual')})`); renderOrder(); });
  on('m-cancel',async ()=>{ closeModal(bg); const r=await promptBox(t('cancel_reason')); if(r===null) return; await saveOrder({status:'cancelled',cancelReason:r},`${t('cancelled')}: ${r}`); renderOrder(); });
  on('m-dup',async ()=>{ closeModal(bg); const num=await DB.next('order_'+new Date().getFullYear()); const d=clone(o); delete d.id;
    Object.assign(d,{number:`${S.settings.orderPrefix||'EGF'}-${String(new Date().getFullYear()).slice(2)}-${pad(num)}`,status:'inquiry',piNumber:'',piDate:'',docs:{},health:{status:'draft'},shipment:{mode:d.shipment.mode,containerType:d.shipment.containerType},production:{},cancelReason:'',
      items:d.items.map(it=>({...it,id:uid(),batch:'',prodDate:'',expDate:'',loadedCartons:''})),history:[{at:nowISO(),by:who(),action:t('h_dup_from')+' '+o.number}],createdAt:nowISO()});
    const id=await DB.add('orders',d); location.hash='#/order/'+id; });
  on('m-del',async ()=>{ closeModal(bg); if(!await confirmBox(t('delete_order_q'),{danger:1})) return; await DB.del('orders',o.id); location.hash='#/orders'; });
}

    ${fld(t('notes_doc'),'notes',o.notes,{type:'textarea',cls:'full',hint:t('notes_doc_hint')})}</div>`,

  const c=itemCalc(it);
  const ro = ed?'':'readonly';
  return `<tr data-id="${it.id}"><td class="muted">${i+1}</td>
    <td><div class="bold">${esc(L(it.nameAr,it.nameEn))}</div><div class="tiny muted">${esc(L(it.nameEn,it.nameAr))} ${it.code?'· <span class="mono">'+esc(it.code)+'</span>':''}</div>
      <input class="in sm mt-s" data-f="flavours" value="${esc((it.flavours||[]).join('، '))}" placeholder="${t('flavours')}" ${ro} oninput="markDirty()"></td>
    <td><input class="in sm num-in" data-f="packSize" value="${esc(it.packSize)}" style="width:70px" ${ro} oninput="markDirty()"></td>
    <td><input class="in sm num-in" data-f="unitsPerCarton" type="number" value="${esc(it.unitsPerCarton)}" style="width:72px" ${ro} oninput="markDirty();itemsTotals()"></td>
    <td><input class="in sm num-in" data-f="cartons" type="number" value="${esc(it.cartons)}" style="width:86px" ${ro} oninput="markDirty();itemsTotals()"></td>
    <td><input class="in sm num-in" data-f="pricePerCarton" type="number" step="0.01" value="${esc(it.pricePerCarton)}" style="width:90px" ${ro} oninput="markDirty();itemsTotals()"></td>
    <td class="num bold" data-c="line">${money(c.line,OD.o.currency)}</td>
    <td><input type="checkbox" data-f="onDiscount" ${it.onDiscount?'checked':''} ${ed?'':'disabled'} onchange="markDirty();itemsTotals()"></td>
    <td class="num small" data-c="gross">${fmt(c.grossKg)} kg</td><td class="num small" data-c="cbm">${fmt(c.cbm,2)}</td>
    <td class="act">${ed?`<button class="btn btn-g btn-xs" onclick="itemDetails('${it.id}')" title="${t('details')}">${IC.edit}</button><button class="btn btn-g btn-xs" onclick="rmItem('${it.id}')">${IC.trash}</button>`:''}</td></tr>`;
}
function collectItems(){
  const tb=$('it-tbl'); if(!tb) return; const o=OD.o;
  tb.querySelectorAll('tbody tr[data-id]').forEach(tr=>{ const it=o.items.find(x=>x.id===tr.dataset.id); if(!it) return;
    tr.querySelectorAll('[data-f]').forEach(el=>{ const f=el.dataset.f; if(el.type==='checkbox') it[f]=el.checked; else if(f==='flavours') it.flavours=el.value.split(/[,،]/).map(s=>s.trim()).filter(Boolean); else if(el.type==='number') it[f]= el.value===''?'':n(el.value); else it[f]=el.value; }); });
  const d=$('disc'); if(d) o.discountPct=n(d.value);
}
function itemsTotals(){
  collectItems(); const o=OD.o, c=orderCalc(o);
  document.querySelectorAll('#it-tbl tbody tr[data-id]').forEach(tr=>{ const x=c.items.find(z=>z.it.id===tr.dataset.id); if(!x) return; tr.querySelector('[data-c=line]').textContent=money(x.c.line,o.currency); tr.querySelector('[data-c=gross]').textContent=fmt(x.c.grossKg)+' kg'; tr.querySelector('[data-c=cbm]').textContent=fmt(x.c.cbm,2); });
  const f=$('it-foot'); if(f) f.innerHTML = `<tr><td colspan="4" class="right">${t('totals')}</td><td class="num">${fmt(c.cartons)}</td><td></td><td class="num">${money(c.sub,o.currency)}</td><td class="num small" style="color:var(--bad)">${c.disc?'−'+money(c.disc,o.currency):''}</td><td class="num nowrap">${fmt(c.grossKg)} kg</td><td class="num">${fmt(c.cbm,2)}</td><td class="num" style="color:var(--navy)">${money(c.total,o.currency)}</td></tr>`;
}
function addItem(manual){
  collectItems(); const o=OD.o;
  if(manual){ o.items.push(mkItem({nameAr:t('new_item'),nameEn:'New item'})); }
  else { const pid=$('add-prod').value; if(!pid){ toast(t('choose_product'),'bad'); return; } const p=byId(S.cache.products,pid); o.items.push(mkItem(p)); }
  markDirty(); tabItems(); OD.dirty=true; $('od-save') && $('od-save').classList.add('btn-a');
  const last=[...document.querySelectorAll('#it-tbl [data-f=cartons]')].pop(); last && last.focus();
}
function rmItem(id){ collectItems(); OD.o.items=OD.o.items.filter(x=>x.id!==id); tabItems(); markDirty(); }
function itemDetails(id){
  collectItems(); const it=OD.o.items.find(x=>x.id===id);
  const bg=openModal({title:esc(L(it.nameAr,it.nameEn)), size:'lg', body:`<div class="grid g3" id="idf">
    ${fld(t('name_ar'),'nameAr',it.nameAr)}${fld(t('name_en'),'nameEn',it.nameEn)}${fld(t('code'),'code',it.code)}
    ${fld(t('piece_g'),'pieceG',it.pieceG,{type:'number'})}${fld(t('pieces_per_pack'),'piecesPerPack',it.piecesPerPack,{type:'number'})}${fld(t('net_weight_g'),'netWeightG',it.netWeightG,{type:'number'})}

    ${fld(t('ctn_l'),'cartonL',it.cartonL,{type:'number'})}${fld(t('ctn_w'),'cartonW',it.cartonW,{type:'number'})}${fld(t('ctn_h'),'cartonH',it.cartonH,{type:'number'})}
    ${fld(t('ctn_net_kg'),'cartonNetKg',it.cartonNetKg,{type:'number',hint:t('auto_if_empty')})}${fld(t('ctn_gross_kg'),'cartonGrossKg',it.cartonGrossKg,{type:'number'})}${fld(t('notes'),'notes',it.notes)}</div>

async function saveItems(){
  collectItems(); const o=OD.o;
  try{ await saveOrder({items:o.items, discountPct:n(o.discountPct), status: o.status==='inquiry' && o.items.length && o.items.every(it=>n(it.cartons)&&n(it.pricePerCarton)) ? o.status : o.status}, t('h_items')); toast(t('saved'),'ok'); renderOrder(); }catch(e){ errToast(e); }
}

function payRow(x,o){
  return `<tr class="${x.void?'faint':''}"><td class="num">${fmtDate(x.date)}</td><td>${t('pk2_'+x.kind)}</td><td>${x.method==='cash'?`<span class="bdg b-yel nodot">${t('cash')}</span>`:`<span class="bdg b-info nodot">${t('transfer')}</span>`}</td>
    <td class="num bold">${money(x.amount,x.currency||o.currency)}</td><td class="small mono">${esc(x.reference||x.receiptNo||'')}${x.method==='cash'&&x.receivedBy?`<div class="tiny muted">${t('received_by')}: ${esc(x.receivedBy)}</div>`:''}</td><td>${filePillSync(x.fileId)}</td>
    <td>${x.void?`<span class="bdg b-bad">${t('void')}</span>`:x.confirmed?`<span class="bdg b-ok">${t('confirmed')}</span><div class="tiny muted">${esc(x.confirmedBy||'')}</div>`:`<span class="bdg b-warn">${t('pending_confirm')}</span>`}</td>
    <td class="act">${x.method==='cash'?`<button class="btn btn-g btn-xs" onclick="printReceipt('${x.id}')" title="${t('receipt')}">${IC.print}</button>`:''}
      ${!x.confirmed&&!x.void&&(can('payments.confirm'))?`<button class="btn btn-ok btn-xs" onclick="payConfirm('${x.id}')">${IC.check} ${t('confirm_pay')}</button>`:''}
      ${!x.void&&(S.profile.role==='admin'||(!x.confirmed&&can('payments.add')))?`<button class="btn btn-g btn-xs" onclick="payVoid('${x.id}')" title="${t('void')}">${IC.x}</button>`:''}</td></tr>`;
}
function payForm(id, orderId){
  const o = byId(S.cache.orders,orderId) || (OD&&OD.o);
  const p = payCalc(o,S.cache.payments);
  const kind = p.paid < p.depositReq-0.005 ? 'deposit' : 'balance';
  const suggest = kind==='deposit' ? round(p.depositReq-p.paid) : round(p.remaining);
  const bg=openModal({title:t('add_payment')+' — '+esc(o.number), body:`<div class="grid g2" id="pyf">
    ${fld(t('kind'),'kind',kind,{opts:['deposit','balance','other'].map(k=>[k,t('pk2_'+k)])})}${fld(t('method'),'method','transfer',{opts:[['transfer',t('transfer')],['cash',t('cash')]]})}
    ${fld(t('amount'),'amount',suggest||'',{type:'number',req:1})}${fld(t('currency'),'currency',o.currency||'USD',{opts:CURRENCIES})}
    ${fld(t('date'),'date',todayISO(),{type:'date'})}<div id="py-ref">${fld(t('transfer_ref'),'reference','',{ph:'SWIFT / MT103'})}</div>
    <div id="py-cash" class="hidden span2">${fld(t('received_by'),'receivedBy',S.profile.name)}</div>
    <div class="full">${fileField(t('pay_proof'),'file','')}</div>
    ${fld(t('notes'),'notes','',{type:'textarea',cls:'full'})}</div>
    <div class="alert al-info mt">${IC.info}<div>${t('pay_confirm_info')}</div></div>`,
    foot:`<button class="btn btn-o" onclick="closeModal()">${t('cancel')}</button><button class="btn btn-p" id="pyf-s">${t('save')}</button>`});
  const m=bg.querySelector('[name=method]'); const sw=()=>{ const cash=m.value==='cash'; bg.querySelector('#py-cash').classList.toggle('hidden',!cash); bg.querySelector('#py-ref').classList.toggle('hidden',cash); }; m.onchange=sw;
  bg.querySelector('#pyf-s').onclick=async ()=>{
    const root=bg.querySelector('#pyf'); const f=readForm(root); if(!n(f.amount)){ toast(t('fill_required'),'bad'); return; }
    const b=bg.querySelector('#pyf-s'); b.disabled=true;
    try{ f.orderId=o.id; f.fileId=await saveFileField(root,'file',{col:'payments',id:o.id}); f.confirmed=false;
      if(f.method==='cash'){ f.receiptNo = `${S.settings.receiptPrefix||'RC'}-${new Date().getFullYear()}-${pad(await DB.next('receipt_'+new Date().getFullYear()))}`; f.reference=''; } else f.receivedBy='';
      const pid = await DB.add('payments',f); await DB.all('files',true);
      if(OD && OD.o.id===o.id) await saveOrder({}, `${t('h_payment')}: ${money(f.amount,f.currency)} (${t(f.method)})`);
      closeModal(bg); toast(t('saved'),'ok'); route();
      if(f.method==='cash' && await confirmBox(t('print_receipt_q'))) printReceipt(pid);
    }catch(e){ errToast(e); b.disabled=false; }
  };
}
async function payConfirm(id){
  const x=byId(S.cache.payments,id); if(!await confirmBox(t('confirm_pay_q').replace('{a}',money(x.amount,x.currency)))) return;
  try{ await DB.update('payments',id,{confirmed:true,confirmedBy:who(),confirmedAt:nowISO()});
    if(OD && OD.o.id===x.orderId) await saveOrder({}, `${t('h_pay_confirmed')}: ${money(x.amount,x.currency)}`);
    else { const o=await DB.get('orders',x.orderId); if(o) await DB.update('orders',o.id,{history:[...(o.history||[]),{at:nowISO(),by:who(),action:`${t('h_pay_confirmed')}: ${money(x.amount,x.currency)}`}]}); }
    toast(t('saved'),'ok'); route(); }catch(e){ errToast(e); }
}
async function payVoid(id){ const r=await promptBox(t('void_reason')); if(r===null) return; try{ await DB.update('payments',id,{void:true,voidReason:r,voidBy:who()}); toast(t('saved'),'ok'); route(); }catch(e){ errToast(e); } }

async function healthZip(){
  const files=healthFiles(); if(!files.length && !OD.o.items.length){ toast(t('nothing_to_zip'),'bad'); return; }
  if(!window.JSZip){ toast('JSZip not loaded','bad'); return; }
  toast(t('preparing_zip'));
  try{
    const zip=new JSZip(); const used={};
    for(const [i,f] of files.entries()){ const {blob,meta}=await FILES.blob(f.fileId); const dot=meta.name.lastIndexOf('.'); const ext=dot>0?meta.name.slice(dot):'';
      let nm=`${pad(i+1,2)} - ${f.label}`.replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,120)+ext; if(used[nm]) nm=nm.slice(0,nm.length-ext.length)+'_'+(++used[nm])+ext; else used[nm]=1; zip.file(nm,blob); }
    zip.file(`طلب شهادة صحية - ${OD.o.number}.doc`, healthDocBlob());
    zip.file('email.txt', `${defaultHealthSubject(OD.o)}\n\n${healthEmailBody(OD.o)}`);
    const out=await zip.generateAsync({type:'blob'}); saveBlob(out, `health-cert-${OD.o.number}.zip`); toast(t('zip_ready'),'ok');
  }catch(e){ errToast(e); }
}

    <div class="card"><div class="card-h"><h3>${t('result')}</h3></div><div class="card-b">
      <div class="field mb"><label>${t('container_type')}</label><select class="in" id="cl-ct" onchange="calcRun()">${Object.keys(CONTAINERS).map(k=>`<option ${k==='40HC'?'selected':''}>${k}</option>`).join('')}</select></div>
      <div id="cl-res"></div></div></div></div>`;

function calcDraw(){
  $('cl-t').querySelector('tbody').innerHTML = CALC_ROWS.map((r,i)=>`<tr data-i="${i}"><td><input class="in sm" data-f="name" value="${esc(r.name)}" style="min-width:140px"></td>${['L','W','H','kg','qty'].map(f=>`<td><input class="in sm num-in" type="number" data-f="${f}" value="${esc(r[f])}" style="width:78px"></td>`).join('')}<td class="num bold" data-c="max">—</td><td><button class="btn btn-g btn-xs" onclick="CALC_ROWS.splice(${i},1);calcDraw()">${IC.trash}</button></td></tr>`).join('')
    + `<tr><td colspan="8"><button class="btn btn-g btn-s" onclick="CALC_ROWS.push({name:'',L:'',W:'',H:'',kg:'',qty:''});calcDraw()">${IC.plus} ${t('add_row')}</button></td></tr>`;
  $('cl-t').querySelectorAll('input').forEach(i=>i.oninput=()=>{ const r=CALC_ROWS[i.closest('tr').dataset.i]; r[i.dataset.f]= i.type==='number'? i.value : i.value; calcRun(); });
  calcRun();
}
function calcAdd(){ const p=byId(S.cache.products,$('cl-p').value); if(!p) return; const c=itemCalc({...p,cartons:1}); const blank=CALC_ROWS.findIndex(r=>!r.name&&!r.L); const row={name:prodName(p),L:p.cartonL,W:p.cartonW,H:p.cartonH,kg:c.ctnGross,qty:''}; if(blank>-1) CALC_ROWS[blank]=row; else CALC_ROWS.push(row); calcDraw(); }
function calcRun(){
  const type=$('cl-ct').value, c=CONTAINERS[type]; $('cl-ct-l').textContent=type;
  const est=containerEstimate(CALC_ROWS,type);
  est.rows.forEach((r,i)=>{ const td=document.querySelector(`#cl-t tr[data-i="${i}"] [data-c=max]`); if(td) td.textContent = r.maxAlone>0 && isFinite(r.maxAlone)? fmt(r.maxAlone) : '—'; });
  const all = Object.keys(CONTAINERS).map(k=>[k,containerEstimate(CALC_ROWS,k)]);
  $('cl-res').innerHTML = `<div class="bar ${est.fill>100?'':'ok'}" style="height:14px"><i style="width:${Math.min(100,est.fill)}%;${est.fill>100?'background:var(--bad)':''}"></i></div>

    <dl class="kv mt"><dt>${t('total_cbm')}</dt><dd class="num">${fmt(est.cbm,2)} m³</dd><dt>${t('total_weight')}</dt><dd class="num">${fmt(est.kg)} kg</dd>
      <dt>${t('vol_fill')}</dt><dd class="num">${fmt(est.fillVol)}% <span class="muted small">(${t('of')} ${c.cbmPractical} m³)</span></dd><dt>${t('weight_fill')}</dt><dd class="num">${fmt(est.fillKg)}% <span class="muted small">(${t('of')} ${fmt(c.kg)} kg)</span></dd>
      ${est.share!=null?`<dt>${t('carton_fit')}</dt><dd class="num">${fmt(est.share)}%</dd>`:''}<dt>${t('containers_needed')}</dt><dd class="num">${est.containers}</dd></dl>
    <div class="sep"></div><div class="small bold mb">${t('compare')}</div>${all.map(([k,e])=>`<div class="row between small" style="padding:4px 0"><span class="bold">${k}</span><span class="num">${fmt(e.fill)}% · ${e.containers} ${t('container_s')}</span></div>`).join('')}
    <div class="small muted mt">${t('calc_note')}</div>`;
}

/* ============================== printable documents ============================== */
function openPrint(title, pages, {land=false, extra=''}={}){
  const old=document.querySelector('.pv'); if(old) old.remove();
  const pv=document.createElement('div'); pv.className='pv';
  pv.innerHTML = `<div class="pv-bar"><span class="t">${esc(title)}</span>${extra}<button class="btn btn-a btn-s" id="pv-print">${IC.print} ${t('print_pdf')}</button><button class="btn btn-o btn-s" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)" id="pv-close">${IC.x} ${t('close')}</button></div>
    <div class="pv-pages">${pages.map(p=>`<div class="doc-page ${land?'land':''}">${p}</div>`).join('')}</div>`;
  document.body.appendChild(pv);
  let st=document.getElementById('pv-page-style'); if(!st){ st=document.createElement('style'); st.id='pv-page-style'; document.head.appendChild(st); }
  st.textContent = `@page{size:A4 ${land?'landscape':'portrait'};margin:8mm}`;

/* ---------- amount in words (English) ---------- */
function amountWords(v, cur='USD'){
  const ones=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  const w3 = x => { let s=''; if(x>=100){ s+=ones[Math.floor(x/100)]+' hundred'; x%=100; if(x) s+=' and '; } if(x>=20){ s+=tens[Math.floor(x/10)]; if(x%10) s+='-'+ones[x%10]; } else if(x) s+=ones[x]; return s; };
  const words = num => { if(num===0) return 'zero'; const parts=[[1e9,'billion'],[1e6,'million'],[1e3,'thousand'],[1,'']]; let s=[]; parts.forEach(([d,l])=>{ const q=Math.floor(num/d); if(q){ s.push(w3(q)+(l?' '+l:'')); num%=d; } }); return s.join(' '); };
  const names={USD:['US dollars','cents'],EUR:['euros','cents'],GBP:['pounds sterling','pence'],SAR:['Saudi riyals','halalas'],AED:['UAE dirhams','fils'],EGP:['Egyptian pounds','piasters']}[cur]||[cur,'cents'];
  const whole=Math.floor(n(v)), frac=Math.round((n(v)-whole)*100);
  const s = words(whole)+' '+names[0]+(frac? ' and '+words(frac)+' '+names[1] : '')+' only';
  return s.charAt(0).toUpperCase()+s.slice(1);
}

const fx = (v,d=2) => n(v).toLocaleString('en-US',{maximumFractionDigits:d});

const poGS = it => (n(it.pieceG) && n(it.piecesPerPack)) ? [n(it.pieceG), n(it.piecesPerPack)] : [n(it.netWeightG), 1];
function poRow(it){ const [g,s]=poGS(it), u=n(it.unitsPerCarton), q=n(it.cartons), pcs=u*q; return {g,s,u,q,pcs,grams:g*s*pcs,stk:it.stickers?pcs:0}; }
const poW = (grams,unit) => unit==='ton' ? fx(grams/1e6,3) : unit==='both' ? `${fx(grams/1000,2)}<small>${fx(grams/1e6,3)} طن</small>` : fx(grams/1000,2);

  <div style="margin-top:10px"><div style="background:#2d2a76;color:#fff;font-weight:800;font-size:11px;letter-spacing:1.3px;text-transform:uppercase;padding:7px 14px;text-align:center">BANK DETAILS (FOR PAYMENT PURPOSES ONLY)</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;border:1px solid #e5e7eb;border-top:none">
      ${bk('Bank',s.bank,0,'border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb')}${bk('Beneficiary',s.beneficiary,0,'border-bottom:1px solid #e5e7eb')}
      ${bk('Account No',s.account,1,'border-right:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb')}${bk(`IBAN (${cur})`,s.iban,1,'border-bottom:1px solid #e5e7eb')}
      ${bk('SWIFT / BIC',s.swift,1,'grid-column:1/-1')}</div></div>
  <div style="height:16px"></div></div>`;
}
function printInvoice(kind){ const o=OD.o; openPrint(`${({inv:'Invoice',pi:'PI',quote:'Quotation'})[kind]} ${o.number}`, [invoiceDoc(o,kind)]); }

/* ============================== sidebar: invoices + production orders ============================== */
async function loadOD(id){ const o=await DB.get('orders',id); if(!o) throw new Error(t('not_found'));
  o.items=o.items||[]; o.shipment=o.shipment||{}; o.docs=o.docs||{}; o.health=o.health||{status:'draft'}; o.history=o.history||[]; o.production=o.production||{};
  await Promise.all([DB.all('countries'), DB.all('payments')]); OD={o, tab:'items', dirty:false}; return o; }
async function quickPrint(id, kind){ try{ await loadOD(id); if(kind==='po') printProduction(); else printInvoice(kind); }catch(e){ errToast(e); } }

PAGES.invoices = { perm:'orders', async render(){
  await DB.all('orders',true);
  $('view').innerHTML = pageHead(`<div class="row wrap">${searchBox('iv-q',t('search_orders'),'invList()')}</div>`, can('orders.edit')?`<button class="btn btn-p" onclick="newOrder()">${IC.plus} ${t('new_invoice')}</button>`:'')
    + `<div class="alert al-info mb">${IC.info}<div>${t('invoices_hint')}</div></div><div class="card"><div class="tbl-wrap" id="iv-list"></div></div>`;
  invList();
}};
function invList(){
  const q=($('iv-q').value||'').toLowerCase();
  const rows=(S.cache.orders||[]).filter(o=>o.status!=='cancelled' && (!q||[o.number,o.piNumber,o.invoiceNo,custName(o),(o.customer||{}).country].join(' ').toLowerCase().includes(q))).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  $('iv-list').innerHTML = rows.length? `<table class="tbl"><thead><tr><th>${t('order_no')}</th><th>${t('invoice_no')}</th><th>${t('customer')}</th><th>${t('destination')}</th><th>${t('cartons')}</th><th>${t('value')}</th><th>${t('status')}</th><th></th></tr></thead><tbody>
    ${rows.map(o=>{ const c=orderCalc(o); return `<tr><td><a class="mono bold nowrap" href="#/order/${o.id}">${esc(o.number)}</a></td><td class="mono small">${esc(o.invoiceNo||o.piNumber||'—')}</td><td class="bold">${esc(custName(o))}</td><td>${esc((o.customer||{}).country||'')}</td><td class="num">${fmt(c.cartons)}</td><td class="num bold">${money(c.total,o.currency)}</td><td>${statusBadge(o.status)}</td>
      <td class="act nowrap"><button class="btn btn-a btn-xs" onclick="quickPrint('${o.id}','inv')">${IC.print} ${t('doc_invoice_s')}</button><button class="btn btn-o btn-xs" onclick="quickPrint('${o.id}','pi')">PI</button><button class="btn btn-o btn-xs" onclick="quickPrint('${o.id}','quote')">${t('doc_quote')}</button><a class="btn btn-g btn-xs" href="#/order/${o.id}/items" title="${t('open')}">${IC.edit}</a></td></tr>`; }).join('')}</tbody></table>`
    : emptyBox(t('no_orders'), can('orders.edit')?`<button class="btn btn-p" onclick="newOrder()">${IC.plus} ${t('new_invoice')}</button>`:'');
}

PAGES.production = { perm:'production', async render(){
  await DB.all('orders',true);
  $('view').innerHTML = pageHead(`<div class="row wrap">${searchBox('po-q',t('search_orders'),'poList()')}
      <select class="in" id="po-st" style="width:200px" onchange="poList()"><option value="open">${t('open_orders')}</option><option value="">${t('all')}</option></select></div>`, can('orders.edit')?`<button class="btn btn-p" onclick="newOrder()">${IC.plus} ${t('new_prod_order')}</button>`:'')
    + `<div class="alert al-info mb">${IC.info}<div>${t('prod_orders_hint')}</div></div><div class="card"><div class="tbl-wrap" id="po-list"></div></div>`;
  poList();
}};
function poList(){
  const q=($('po-q').value||'').toLowerCase(), st=$('po-st').value;
  const rows=(S.cache.orders||[]).filter(o=>o.status!=='cancelled' && (st!=='open' || !['shipped','delivered','closed'].includes(o.status)) && (!q||[o.number,custName(o),(o.customer||{}).country,o.salesRep].join(' ').toLowerCase().includes(q))).sort((a,b)=>(a.deliveryDate||a.loadingDate||'9').localeCompare(b.deliveryDate||b.loadingDate||'9'));
  $('po-list').innerHTML = rows.length? `<table class="tbl"><thead><tr><th>${t('order_no')}</th><th>${t('customer')}</th><th>${t('country')}</th><th>${t('sales_rep')}</th><th>${t('delivery_date')}</th><th>${t('loading_date')}</th><th>${t('prod_kg')}</th><th>${t('sticker')}</th><th>${t('cartons')}</th><th>${t('status')}</th><th></th></tr></thead><tbody>
    ${rows.map(o=>{ let g=0,s=0,q=0; (o.items||[]).forEach(it=>{ const r=poRow(it); g+=r.grams; s+=r.stk; q+=r.q; }); return `<tr><td><a class="mono bold nowrap" href="#/order/${o.id}/production">${esc(o.number)}</a></td><td class="bold">${esc(custName(o))}</td><td>${esc((o.customer||{}).country||'')}</td><td>${esc(o.salesRep||'')}</td>
      <td>${o.deliveryDate?dateBadge(o.deliveryDate,3):'—'}</td><td class="num">${o.loadingDate?fmtDate(o.loadingDate):'—'}</td><td class="num bold">${fx(g/1000,2)} kg</td><td class="num">${fx(s,0)}</td><td class="num">${fmt(q)}</td><td>${statusBadge(o.status)}</td>
      <td class="act nowrap"><button class="btn btn-a btn-xs" onclick="quickPrint('${o.id}','po')">${IC.print} ${t('print_prod_order')}</button><a class="btn btn-o btn-xs" href="#/order/${o.id}/production">${IC.edit} ${t('open')}</a></td></tr>`; }).join('')}</tbody></table>`
    : emptyBox(t('no_orders'), can('orders.edit')?`<button class="btn btn-p" onclick="newOrder()">${IC.plus} ${t('new_prod_order')}</button>`:'');
}

/* ===== the company's original tools, embedded unchanged =====
   أوردر الإنتاج: نفس الملف الأصلي (بيحفظ على مشروع Firebase بتاعه زي ما هو، فالأوردرات القديمة بتظهر)
   مولّد الفاتورة: نفس الملف الأصلي (الفواتير المحفوظة على المتصفح زي ما كان) */
function legacyDoc(kind){
  let html = LEGACY[kind];
  if(kind==='po'){
    // نشيل القايمة الجانبية والهيدر بتوعه بس (عشان السيستم ليه قايمته)، ونحط مكانهم تابات صغيرة لنفس الصفحات التلاتة
    const css = `<style>.sb,.topbar,.scrim{display:none!important}body.erp .page{padding:14px 20px 30px}.egf-sub{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:14px;gap:2px}.egf-sub button{border:0;background:transparent;padding:8px 18px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--soft)}.egf-sub button[aria-pressed="true"]{background:var(--blue);color:#fff;font-weight:600}.egf-sub b{font-weight:600;font-size:11px;margin-inline-start:6px;opacity:.8}@media print{.egf-sub{display:none!important}}</style>`;
    const bar = `<div class="egf-sub" id="egfSub"><button data-v="order" aria-pressed="true" onclick="go('order')">أوردر الإنتاج</button><button data-v="orders" onclick="go('orders')">الأوردرات المحفوظة<b id="egfOrdN"></b></button><button data-v="pasta" onclick="go('pasta')">أمر إنتاج مكرونة<b id="egfPN"></b></button></div>`;
    const js = `<script>(function(){const g=window.go;window.go=function(v,b){g(v,b);document.querySelectorAll('#egfSub button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===v));};
      setInterval(function(){var a=document.getElementById('ordersTag'),b=document.getElementById('pastaTag');document.getElementById('egfOrdN').textContent=a?a.textContent:'';document.getElementById('egfPN').textContent=b?b.textContent:'';},800);})();<\/script>`;
    html = html.replace('</head>', css+'</head>').replace('<main class="page">', '<main class="page">'+bar).replace('</body>', js+'</body>');
  }
  return html;
}
function legacyPage(kind){
  $('view').innerHTML = `<iframe class="legacy" id="lg-${kind}" title="${kind==='po'?t('pg_production'):t('pg_invoices')}"></iframe>`;
  const f=$('lg-'+kind); f.srcdoc = legacyDoc(kind);
}
PAGES.invoices = { perm:'orders', async render(){ legacyPage('inv'); } };
PAGES.production = { perm:'production', async render(){ legacyPage('po'); } };

boot();
</script>
