/* One API for both modes:
   - demo: IndexedDB in this browser
   - firebase: Firestore (files stored as chunks in Firestore, so no Storage/Blaze plan is needed) */
const FB = {};
const DB = {
  mode: IS_DEMO ? 'local' : 'firebase',
  async init(){
    if(this.mode==='local') return LocalDB.open();
    const v = CFG.firebaseSdkVersion || '10.12.2', base = `https://www.gstatic.com/firebasejs/${v}/`;
    const [app, auth, fs] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')]);
    FB.app = app.initializeApp(CFG.firebase); FB.appMod = app; FB.authMod = auth; FB.fs = fs;
    FB.auth = auth.getAuth(FB.app); FB.db = fs.getFirestore(FB.app);
  },
  // كاش ذكي: الطلبات المتكررة لنفس البيانات بتتجمع، وما بنعيدش التحميل من Firebase إلا لو البيانات قديمة
  // force=true ← يعيد التحميل لو عدّى وقت معين (البيانات اللي بتتغير كتير 20 ثانية، الثابتة 5 دقايق)
  // force='hard' ← يعيد التحميل دايمًا
  _at:{}, _fly:{},
  STATIC:['countries','products','certs','tests','team','customers','cartons','users'],
  async all(col, force){
    const age = Date.now() - (this._at[col]||0), ttl = this.STATIC.includes(col) ? 300000 : 20000;
    if(S.cache[col] && (!force || (force!=='hard' && age < ttl))) return S.cache[col];
    if(this._fly[col]) return this._fly[col];
    const p = (async ()=>{
      let rows;
      if(this.mode==='local') rows = await LocalDB.all(col);
      else { const snap = await FB.fs.getDocs(FB.fs.collection(FB.db, col)); rows = snap.docs.map(d=>({id:d.id, ...d.data()})); }
      if(col==='orders') rows.forEach(normOrder);
      S.cache[col] = rows; this._at[col] = Date.now(); return rows;
    })();
    this._fly[col] = p;
    try{ return await p; } finally{ delete this._fly[col]; }
  },
  refreshAll(){ this._at = {}; },
  async where(col, field, val){
    if(this.mode==='local') return (await LocalDB.all(col)).filter(x=>x[field]===val);
    const q = FB.fs.query(FB.fs.collection(FB.db,col), FB.fs.where(field,'==',val));
    const snap = await FB.fs.getDocs(q); return snap.docs.map(d=>({id:d.id,...d.data()}));
  },
  async get(col, id){
    let r;
    if(this.mode==='local') r = await LocalDB.get(col,id);
    else { const d = await FB.fs.getDoc(FB.fs.doc(FB.db,col,id)); r = d.exists()? {id:d.id,...d.data()} : null; }
    if(r && col==='orders') normOrder(r);
    if(r && col!=='file_chunks') this._put(col,r); return r;
  },
  async add(col, data){
    const id = uid(); const rec = {...data, createdAt: data.createdAt||nowISO(), createdBy: data.createdBy||who()};
    await this.set(col, id, rec); return id;
  },
  async set(col, id, data){
    const rec = clean({...data, updatedAt: nowISO(), updatedBy: who()}); delete rec.id;
    if(this.mode==='local') await LocalDB.put(col,id,rec);
    else await FB.fs.setDoc(FB.fs.doc(FB.db,col,id), rec);
    if(col!=='file_chunks') this._put(col,{id,...rec}); return id;
  },
  async update(col, id, patch){
    const p = clean({...patch, updatedAt: nowISO(), updatedBy: who()}); delete p.id;
    if(this.mode==='local'){ const cur = await LocalDB.get(col,id)||{}; await LocalDB.put(col,id,{...cur,...p}); }
    else await FB.fs.updateDoc(FB.fs.doc(FB.db,col,id), p);
    const c = byId(S.cache[col],id); if(c) Object.assign(c,p);
  },
  async del(col, id){
    if(this.mode==='local') await LocalDB.del(col,id);
    else await FB.fs.deleteDoc(FB.fs.doc(FB.db,col,id));
    if(S.cache[col]) S.cache[col] = S.cache[col].filter(x=>x.id!==id);
  },
  async next(key){ // atomic counter
    if(this.mode==='local'){ const c = await LocalDB.get('counters',key)||{v:0}; c.v=n(c.v)+1; await LocalDB.put('counters',key,c); return c.v; }
    const ref = FB.fs.doc(FB.db,'counters',key);
    return FB.fs.runTransaction(FB.db, async tx=>{ const d = await tx.get(ref); const v = (d.exists()? n(d.data().v):0)+1; tx.set(ref,{v}); return v; });
  },
  _put(col, r){ if(!S.cache[col]) return; const i = S.cache[col].findIndex(x=>x.id===r.id); if(i>-1) S.cache[col][i]=r; else S.cache[col].push(r); },
};
const who = () => S.profile ? (S.profile.name||S.profile.email||'') : '';
function clean(o){ if(Array.isArray(o)) return o.map(clean); if(o && typeof o==='object'){ const r={}; for(const k in o){ if(o[k]!==undefined) r[k]=clean(o[k]); } return r; } return o; }

/* ---------- IndexedDB (demo mode) ---------- */
const LocalDB = {
  db:null,
  open(){ return new Promise((res,rej)=>{ const r = indexedDB.open('egf_export',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{this.db=r.result;res()}; r.onerror=()=>rej(r.error); }); },
  tx(mode){ return this.db.transaction('kv',mode).objectStore('kv'); },
  req(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  get(col,id){ return this.req(this.tx('readonly').get(col+'/'+id)).then(v=>v? {id,...v}:null); },
  put(col,id,v){ const c={...v}; delete c.id; return this.req(this.tx('readwrite').put(c, col+'/'+id)); },
  del(col,id){ return this.req(this.tx('readwrite').delete(col+'/'+id)); },
  all(col){ return new Promise((res,rej)=>{ const out=[]; const r = this.tx('readonly').openCursor(IDBKeyRange.bound(col+'/', col+'/￿'));
    r.onsuccess=()=>{ const c=r.result; if(c){ out.push({id:String(c.key).slice(col.length+1), ...c.value}); c.continue(); } else res(out); }; r.onerror=()=>rej(r.error); }); },
  async wipe(){ return this.req(this.tx('readwrite').clear()); }
};

/* ---------- files (chunked in Firestore / IndexedDB) ---------- */
const CHUNK = 700*1024; const MAX_FILE = 9*1024*1024;
const FILES = {
  async upload(file, ref={}){
    if(file.size > MAX_FILE) throw new Error(t('file_too_big'));
    const b64 = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]||''); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(file); });
    const parts = Math.max(1, Math.ceil(b64.length/CHUNK));
    const id = uid();
    await Promise.all(Array.from({length:parts},(_,i)=>DB.set('file_chunks', id+'_'+i, {fileId:id, i, data: b64.slice(i*CHUNK,(i+1)*CHUNK)})));
    await DB.set('files', id, {name:file.name, type:file.type||'application/octet-stream', size:file.size, parts, ref, uploadedAt:nowISO(), uploadedBy:who()});
    if(S.cache.file_chunks) delete S.cache.file_chunks;
    return id;
  },
  async meta(id){ return byId(S.cache.files,id) || DB.get('files',id); },
  async blob(id){
    const m = await this.meta(id); if(!m) throw new Error(t('file_missing'));
    const cs = await Promise.all(Array.from({length:m.parts},(_,i)=>DB.get('file_chunks', id+'_'+i))); const s = cs.map(c=>c?c.data:'').join('');
    const bin = atob(s); const arr = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    return {blob:new Blob([arr],{type:m.type}), meta:m};
  },
  async open(id){ try{ const {blob} = await this.blob(id); const url=URL.createObjectURL(blob); window.open(url,'_blank'); setTimeout(()=>URL.revokeObjectURL(url),60000); }catch(e){ errToast(e); } },
  async download(id){ try{ const {blob,meta} = await this.blob(id); saveBlob(blob, meta.name); }catch(e){ errToast(e); } },
  async remove(id){ const m = await this.meta(id); if(m) await Promise.all(Array.from({length:m.parts},(_,i)=>DB.del('file_chunks', id+'_'+i))); await DB.del('files', id); },
};
function saveBlob(blob, name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000); }
function pickFile(accept='.pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx'){ return new Promise(res=>{ const i=document.createElement('input'); i.type='file'; i.accept=accept; i.onchange=()=>res(i.files[0]||null); i.click(); }); }
async function filePill(id){ if(!id) return ''; const m = byId(S.cache.files,id); return `<span class="file-pill" onclick="FILES.open('${id}')" title="${esc(m?m.name:'')}">${IC.file}<span>${esc(m?m.name:t('file'))}</span></span>`; }
const filePillSync = id => { if(!id) return ''; const m = byId(S.cache.files,id); return `<span class="file-pill" onclick="FILES.open('${id}')" title="${esc(m?m.name:'')}">${IC.file}<span>${esc(m?m.name:t('file'))}</span></span>`; };

const USER_DOMAIN = 'users.egygulf-foods.com';
const toEmail = u => { u=String(u||'').trim().toLowerCase(); return u.includes('@') ? u : `${u}@${USER_DOMAIN}`; };
const AUTH = {
  async start(onReady){
    if(DB.mode==='local'){
      let p = null; try{ p = JSON.parse(localStorage.getItem('egf_demo_user')||'null'); }catch(e){}
      if(p){ S.user={uid:p.id||'demo'}; S.profile=p; }
      return onReady();
    }
    FB.authMod.onAuthStateChanged(FB.auth, async u=>{
      S.user = u; S.profile = null;
      if(u){
        try{
          let p = await DB.get('users', u.uid);
          const isAdminEmail = (CFG.adminEmails||[]).map(x=>x.toLowerCase()).includes((u.email||'').toLowerCase());
          if(!p && isAdminEmail){ p = {name: u.displayName || u.email.split('@')[0], email:u.email, username:u.email, role:'admin', active:true}; await DB.set('users', u.uid, p); p.id=u.uid; }
          else if(p && isAdminEmail && (p.role!=='admin' || !p.active)){ await DB.update('users',u.uid,{role:'admin',active:true}); p.role='admin'; p.active=true; }
          S.profile = p || {email:u.email, role:'pending', active:false}; S.authErr='';
        }catch(e){ console.error(e); S.authErr = e && e.code==='permission-denied' ? 'Firebase رفض الدخول على البيانات: قواعد الحماية (firestore.rules) مش متلصقة صح في Firestore ← Rules، أو الإيميل اللي فيها مش إيميل المدير.' : (e.message||String(e)); try{ await FB.authMod.signOut(FB.auth); }catch(_){} }
      }
      onReady();
    });
  },
  async login(username, pass){
    if(DB.mode==='local'){
      const users = await LocalDB.all('users'); let p;
      if(username){ const u=users.find(x=>x.username===String(username).trim().toLowerCase());
        if(u){ if(u.password!==pass) throw {code:'auth/invalid-credential'}; if(!u.active) throw new Error('الحساب موقوف'); p={...u}; delete p.password; } }
      if(!p) p={id:'demo',name:username||'Demo Admin',username:'admin',email:'demo@local',role:'admin',active:true};
      localStorage.setItem('egf_demo_user',JSON.stringify(p)); S.user={uid:p.id}; S.profile=p; return;
    }
    await FB.authMod.signInWithEmailAndPassword(FB.auth, toEmail(username), pass);
  },
  // حساب المدير لأول مرة بس (الإيميل لازم يكون في adminEmails)
  async signup(name, email, pass){
    const isAdminEmail = (CFG.adminEmails||[]).map(x=>x.toLowerCase()).includes(email.toLowerCase());
    if(!isAdminEmail) throw new Error('الحسابات بيعملها المدير من صفحة المستخدمين');
    const cred = await FB.authMod.createUserWithEmailAndPassword(FB.auth, email, pass);
    await FB.authMod.updateProfile(cred.user,{displayName:name});
    await DB.set('users', cred.user.uid, {name, email, username:email, role:'admin', active:true});
  },
  // المدير بيعمل مستخدم جديد من غير ما يخرج من حسابه (تطبيق Firebase تاني مؤقت)
  async createUser({name, username, password, tabs, role}){
    username=String(username).trim().toLowerCase();
    if(!/^[a-z0-9._-]{3,}$/.test(username) && !username.includes('@')) throw new Error('اسم المستخدم: حروف إنجليزي وأرقام (3 على الأقل)');
    if(String(password).length<6) throw new Error('كلمة المرور 6 حروف على الأقل');
    const rec = {name, username, email:toEmail(username), tabs, role:role||'user', active:true};
    if(DB.mode==='local'){ const all=await LocalDB.all('users'); if(all.some(x=>x.username===username)) throw new Error('اسم المستخدم موجود'); return DB.add('users',{...rec, password}); }
    const sec = FB.appMod.initializeApp(CFG.firebase, 'sec'+Date.now()); const sAuth = FB.authMod.getAuth(sec);
    try{ const cred = await FB.authMod.createUserWithEmailAndPassword(sAuth, rec.email, password); await FB.authMod.updateProfile(cred.user,{displayName:name});
      await DB.set('users', cred.user.uid, rec); return cred.user.uid; }
    finally{ try{ await FB.authMod.signOut(sAuth); }catch(e){} try{ await FB.appMod.deleteApp(sec); }catch(e){} }
  },
  async changePassword(oldPass, newPass){
    if(DB.mode==='local'){ if(S.profile.id==='demo') throw new Error('مش متاح للحساب التجريبي'); const u=await LocalDB.get('users',S.profile.id); if(u.password!==oldPass) throw new Error('كلمة المرور الحالية غلط'); await LocalDB.put('users',S.profile.id,{...u,password:newPass}); return; }
    const u=FB.auth.currentUser; const c=FB.authMod.EmailAuthProvider.credential(u.email, oldPass); await FB.authMod.reauthenticateWithCredential(u,c); await FB.authMod.updatePassword(u,newPass);
  },
  async reset(email){ await FB.authMod.sendPasswordResetEmail(FB.auth, email); },
  async logout(){ if(DB.mode==='local'){ localStorage.removeItem('egf_demo_user'); location.reload(); return; } await FB.authMod.signOut(FB.auth); location.hash=''; }
};

async function route(){
  if(!S.profile || !$('view')) return;
  const h = location.hash.replace(/^#\/?/,''); const [k, ...rest] = h.split('/');
  const key = k || 'dashboard';
  const navKey = key==='order' ? (TAB2NAV[rest[1]]||'orders') : (NAV_OWNER[key]||key);
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on', a.dataset.k===navKey));
  $('side') && $('side').classList.remove('open');
  if(key==='dashboard' && !hasTab('dashboard') && myTabs().length){ location.hash='#/'+myTabs()[0]; return; }
  const pg = PAGES[key];
  if(!pg){ location.hash='#/dashboard'; return; }
  if((pg.tab && !tabOk(pg.tab)) || (!pg.tab && pg.perm && !permOk(pg.perm))){ $('view').innerHTML = `<div class="card empty">${IC.lock}<div>${t('no_access')}</div></div>`; setTitle(t('no_access')); return; }
  setTitle(t(pg.title || 'pg_'+key));
  $('view').innerHTML = `<div class="loader"><div class="spin"></div>${t('loading')}</div>`;
  window.scrollTo(0,0);
  try{ await pg.render(rest.map(decodeURIComponent)); }catch(e){ console.error(e); $('view').innerHTML = `<div class="alert al-bad">${IC.alert}<div><b>${t('err')}</b><br>${esc(e.code||e.message||e)}</div></div>`; }
  updateCounts();
}

  try{

    set('orders', open.length);

  }catch(e){}
}

async function importCatalog(){
  await DB.all('products',true);
  const cat=catalogProducts(), have=S.cache.products||[];
  const add=cat.filter(p=>!have.some(x=>x.code===p.code)), upd=cat.filter(p=>have.some(x=>x.code===p.code));
  if(!await confirmBox(`استيراد الكاتالوج — حلويات وسناكس (${cat.length} صنف):
• إضافة ${add.length} صنف جديد
• تحديث السعر والمقاسات لـ ${upd.length} صنف موجود`)) return;
  toast(t('uploading'));
  try{
    for(const p of add) await DB.add('products',p);
    for(const p of upd){ const x=have.find(y=>y.code===p.code); await DB.update('products',x.id,{...(p.price===''?{}:{price:p.price}),currency:'USD',cartonL:p.cartonL,cartonW:p.cartonW,cartonH:p.cartonH,realQty40:p.realQty40, ...(x.brandAr?{}:{brandAr:p.brandAr}), ...(p.flavours.length?{flavours:[...new Set([...(x.flavours||[]),...p.flavours])]}:{})}); }
    toast(`تمت إضافة ${add.length} وتحديث ${upd.length}`,'ok'); await DB.all('products',true); if(typeof prodList==='function' && $('p-list')) prodList();
  }catch(e){ errToast(e); }
}

const ORDER_TABS = [['summary','الملخص',null],['invoice','الفاتورة',['orders']],['production','أمر الإنتاج',['orders','production']],['payments','الدفعات',['accounts','orders']],['shipping','الشحن',['orders','calc']],['health','الشهادة الصحية',['health','orders']],['docs','متطلبات البلد',['orders','health','countries']],['files','الملفات',null],['history','السجل',null]];

async function saveOrder(patch, action){
  const o = OD.o; Object.assign(o, patch);
  if(action){ o.history = [...(o.history||[]), {at:nowISO(), by:who(), action}]; patch.history = o.history; }
  await DB.update('orders', o.id, patch); OD.dirty=false;
}
function markDirty(){ OD.dirty=true; const b=$('od-save'); if(b) b.classList.add('btn-a'); }

async function advance(target, force){
  const o=OD.o; const bl = gateBlockers(o,target,ctx());
  if(bl.length && !force){
    const admin = S.profile.role==='admin';
    const bg = openModal({title:t('cant_move')+': '+t('st_'+target), body:`<div class="alert al-warn mb">${IC.alert}<div>${t('blockers_intro')}</div></div><ul style="padding-inline-start:20px;display:flex;flex-direction:column;gap:6px">${bl.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`,
      foot:`<button class="btn btn-o" onclick="closeModal()">${t('close')}</button>${admin?`<button class="btn btn-d" id="ov">${t('override')}</button>`:''}`});
    const ov=bg.querySelector('#ov'); if(ov) ov.onclick = async ()=>{ const r = await promptBox(t('override_reason')); if(!r) return; closeModal(bg); doAdvance(target, `${t('override')}: ${r}`); };
    return;
  }
  doAdvance(target);
}
async function doAdvance(target, note){
  const o=OD.o; const patch={status:target};
  if(target==='confirmed'){ if(!o.piNumber) patch.piNumber='PI-'+o.number; if(!o.piDate) patch.piDate=todayISO(); }
  if(target==='production') patch.production={...(o.production||{}), startedAt:(o.production||{}).startedAt||todayISO()};
  if(target==='ready') patch.production={...(o.production||{}), ...(patch.production||{}), finishedAt:todayISO()};
  if(target==='shipped') patch.shipment={...o.shipment, loadedAt:o.shipment.loadedAt||todayISO(), shippedAt:o.shipment.shippedAt||todayISO()};
  try{ await saveOrder(patch, `${t('h_status')}: ${t('st_'+target)}${note?' — '+note:''}`); toast(t('saved'),'ok'); renderOrder(); }catch(e){ errToast(e); }
}

function payForm(id, orderId){

async function healthZip(){
  const files=healthFiles();
  if(!window.JSZip){ toast('JSZip not loaded','bad'); return; }
  toast(t('preparing_zip'));
  try{
    const zip=new JSZip(); const used={};
    for(const [i,f] of files.entries()){ const {blob,meta}=await FILES.blob(f.fileId); const dot=meta.name.lastIndexOf('.'); const ext=dot>0?meta.name.slice(dot):'';
      let nm=`${pad(i+1,2)} - ${f.label}`.replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim().slice(0,120)+ext; if(used[nm]) nm=nm.slice(0,nm.length-ext.length)+'_'+(++used[nm])+ext; else used[nm]=1; zip.file(nm,blob); }
    zip.file(hcCertName(OD.o), await hcCertBlob(hcCert(OD.o)));
    zip.file('email.txt', `${defaultHealthSubject(OD.o)}\n\n${healthEmailBody(OD.o)}`);
    const out=await zip.generateAsync({type:'blob'}); saveBlob(out, `health-cert-${OD.o.number}.zip`); toast(t('zip_ready'),'ok');
  }catch(e){ errToast(e); }
}

/* حذف الطلبية ومعاها دفعاتها (للمدير بس) */
async function deleteOrderFull(id){
  if(S.profile.role!=='admin'){ toast(t('no_access'),'bad'); return false; }
  const o=byId(S.cache.orders,id) || await DB.get('orders',id); if(!o) return false;
  await DB.all('payments').catch(()=>[]); const pays=(S.cache.payments||[]).filter(p=>p.orderId===id);
  if(!await confirmBox(`حذف الطلبية ${o.number} — ${custName(o)} نهائيًا${pays.length?` مع ${pays.length} دفعة`:''}؟`,{danger:1, okText:'حذف'})) return false;
  try{ for(const p of pays) await DB.del('payments',p.id); await DB.del('orders',id); toast(`تم حذف الطلبية ${o.number}`,'ok'); updateCounts(); return true; }catch(e){ errToast(e); return false; }
}

/* ============================== printable documents ============================== */
function openPrint(title, pages, {land=false, extra=''}={}){
  const old=document.querySelector('.pv'); if(old) old.remove();
  const pv=document.createElement('div'); pv.className='pv';
  pv.innerHTML = `<div class="pv-bar"><span class="t">${esc(title)}</span>${extra}<button class="btn btn-a btn-s" id="pv-print">${IC.print} ${t('print_pdf')}</button><button class="btn btn-o btn-s" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.3)" id="pv-close">${IC.x} ${t('close')}</button></div>
    <div class="pv-pages">${pages.map(p=>{ const h=typeof p==='string'?p:p.html, l=typeof p==='string'?land:!!p.land; return `<div class="doc-page ${l?'land':''}">${h}</div>`; }).join('')}</div>`;
  document.body.appendChild(pv);
  let st=document.getElementById('pv-page-style'); if(!st){ st=document.createElement('style'); st.id='pv-page-style'; document.head.appendChild(st); }
  const anyP=pages.some(p=>typeof p==='string'?!land:!p.land), anyL=pages.some(p=>typeof p==='string'?land:!!p.land);
  st.textContent = anyP&&anyL ? `@page{size:A4 portrait;margin:8mm} @page land{size:A4 landscape;margin:8mm} .doc-page.land{page:land}` : `@page{size:A4 ${anyL?'landscape':'portrait'};margin:8mm}`;
  const close=()=>{ pv.remove(); document.body.classList.remove('printing'); };
  pv.querySelector('#pv-close').onclick=close;
  pv.querySelector('#pv-print').onclick=()=>{ document.body.classList.add('printing'); const prevTitle=document.title; document.title=title; setTimeout(()=>{ window.print(); document.title=prevTitle; document.body.classList.remove('printing'); },50); };
  return pv;
}

/* ---------- amount in words (English) ---------- */
function amountWords(v, cur='USD'){
  const ones=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  const w3 = x => { let s=''; if(x>=100){ s+=ones[Math.floor(x/100)]+' hundred'; x%=100; if(x) s+=' and '; } if(x>=20){ s+=tens[Math.floor(x/10)]; if(x%10) s+='-'+ones[x%10]; } else if(x) s+=ones[x]; return s; };
  const words = num => { if(num===0) return 'zero'; const parts=[[1e9,'billion'],[1e6,'million'],[1e3,'thousand'],[1,'']]; let s=[]; parts.forEach(([d,l])=>{ const q=Math.floor(num/d); if(q){ s.push(w3(q)+(l?' '+l:'')); num%=d; } }); return s.join(' '); };
  const names={USD:['US dollars','cents'],EUR:['euros','cents'],GBP:['pounds sterling','pence'],SAR:['Saudi riyals','halalas'],AED:['UAE dirhams','fils'],EGP:['Egyptian pounds','piasters']}[cur]||[cur,'cents'];
  const whole=Math.floor(n(v)), frac=Math.round((n(v)-whole)*100);
  const s = words(whole)+' '+names[0]+(frac? ' and '+words(frac)+' '+names[1] : '')+' only';
  return s.charAt(0).toUpperCase()+s.slice(1);
}

const EXP_MONTHS = {'1y':12,'1.5y':18,'2y':24};
function poSnacksDoc(o, items, P){
  const pr=o.production||{}, exp=(P&&P.expiry!=null?P.expiry:pr.expiry)??defaultExpiry(o), months=EXP_MONTHS[exp];
  const dt=(P&&P.orderDate)||pr.orderDate||todayISO(), d=new Date(dt+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  const rows=[]; items.forEach(it=>{ const fl=(it.flavours||[]).filter(Boolean), q=n(it.cartons);
    const base={name:it.nameEn||it.nameAr||'', pack:it.packSize||(n(it.netWeightG)?n(it.netWeightG)+'g':''), units:it.unitsPerCarton||''};
    if(fl.length>1 && it.flavQty && fl.every(f=>it.flavQty[f]!=null)) fl.forEach(f=>rows.push({...base, flav:[f], q:n(it.flavQty[f])}));
    else rows.push({...base, flav:fl, q}); });
  const total=sum(rows,r=>r.q);
  return `<div class="pos">
    <div class="pos-head"><div><div class="pos-title"><span class="pos-ic">🏭</span> Production Order — <span dir="rtl">أمر إنتاج</span></div><div class="pos-co">EgyGulf Foods For Snacks &amp; Food Industries</div></div>

    <div class="pos-info"><div class="pos-info-t"><span dir="rtl">أمر الإنتاج</span> &nbsp;—&nbsp; PRODUCTION ORDER INFO</div>
      <div class="pos-info-g"><div><div class="l">RUN NO. / <span dir="rtl">رقم التشغيل</span></div><div class="v">${esc((P&&P.runNo)||'—')}</div></div>
        <div><div class="l">PRODUCTION MONTH / <span dir="rtl">شهر الإنتاج</span></div><div class="v">${esc((P&&P.prodMonth)||String(dt).slice(0,7))}</div></div>
        <div><div class="l">EXPIRY / <span dir="rtl">الصلاحية</span></div><div class="v red" dir="rtl">${months?months+' شهر':'—'}</div></div></div></div>
    <table class="pos-t"><thead><tr><th>#</th><th>Product / <span dir="rtl">المنتج</span></th><th>Flavors / <span dir="rtl">النكهات</span></th><th>Cartons / <span dir="rtl">كرتون</span></th><th>Pack Size</th><th>Units/Carton</th><th>✓</th></tr></thead>
      <tbody>${rows.map((r,i)=>`<tr><td class="no">${i+1}</td><td class="nm">${esc(r.name)}</td><td class="fl">${r.flav.map(f=>`<span class="pill">${esc(f)}</span>`).join(' ')||'—'}</td><td class="q">${r.q?fmt(r.q):''}</td><td>${esc(r.pack)}</td><td>${esc(r.units)}</td><td class="ck"><span class="box"></span></td></tr>`).join('')}</tbody>
      <tfoot><tr><td></td><td colspan="2" class="tot-l">Total / <span dir="rtl">الإجمالي</span></td><td class="q">${fmt(total)}</td><td colspan="3"></td></tr></tfoot></table>
    <div class="pos-notes"><div class="pn purch"><div class="pn-t" dir="rtl">ملاحظات المشتريات</div><div class="pn-x" dir="rtl">${esc((P&&P.notesPurch)||'')}</div></div><div class="pn mfg"><div class="pn-t" dir="rtl">ملاحظات التصنيع</div><div class="pn-x" dir="rtl">${esc((P&&P.notesMfg)||'')}</div></div></div>
    <div class="pos-sign"><div><span>Production Manager</span><span dir="rtl">مدير الإنتاج</span></div><div><span>Quality Control</span><span dir="rtl">مراقبة الجودة</span></div><div><span>Warehouse</span><span dir="rtl">المستودع</span></div></div>
  </div>`;
}

/* ============================================================================
   حاسبة CBM والحاويات — نفس طريقة وشكل حاسبة الشركة:
   أبعاد داخلية 20 قدم 589×235×239 و 40 قدم 1203×235×239، رص كامل 100%،
   أفضل اتجاه للكرتونة + «رص مختلط» بطبقات باتجاهات مختلفة، والرقم «الفعلي» لو متسجل.
   مكتبة المقاسات متخزنة على قاعدة البيانات (مشتركة للفريق)، والكميات اللي بتجرب بيها على جهازك.
   ============================================================================ */
const CBM_C = {
  '20': { L:589, W:235, H:239, label:'20 قدم' },
  '40': { L:1203, W:235, H:239, label:'40 قدم' },
};
Object.values(CBM_C).forEach(c=>c.cbm=c.L*c.W*c.H/1e6);
const ctype = v => String(v||'40').startsWith('20') ? '20' : '40';
const CAT_LABELS = { candy:'الحلويات', snacks:'السناكس' };

function cbPerms(arr){ if(arr.length<=1) return [arr]; const res=[]; for(let i=0;i<arr.length;i++){ const rest=arr.slice(0,i).concat(arr.slice(i+1)); for(const p of cbPerms(rest)) res.push([arr[i],...p]); } return res; }
function bestFit(dims, L, W, H){
  const scale=10, Ls=Math.round(L*scale), Ws=Math.round(W*scale), Hs=Math.round(H*scale);
  const dimsS=dims.map(d=>Math.round(d*scale));
  const options=[];
  for(const [l,w,h] of cbPerms(dimsS)) options.push({ h, bpl:Math.floor(Ls/l)*Math.floor(Ws/w), orient:[l/scale,w/scale,h/scale] });
  let pureBest=0, pureCounts=null;
  for(const o of options){ const layers=Math.floor(Hs/o.h), total=o.bpl*layers;
    if(total>pureBest){ pureBest=total; const l=Math.round(o.orient[0]*scale), w=Math.round(o.orient[1]*scale); pureCounts=[Math.floor(Ls/l),Math.floor(Ws/w),layers]; } }
  const cap=Hs, dp=new Array(cap+1).fill(0), choice=new Array(cap+1).fill(null);
  for(let c=1;c<=cap;c++) for(const o of options){ if(o.h<=c && dp[c-o.h]+o.bpl>dp[c]){ dp[c]=dp[c-o.h]+o.bpl; choice[c]=o; } }
  const mixedBest=dp[cap];
  if(mixedBest>pureBest){ let c=cap; const bands=[]; while(c>0 && choice[c]){ bands.push(choice[c].orient); c-=choice[c].h; } return {count:mixedBest, orient:pureCounts, mixed:true, bands}; }
  return {count:pureBest, orient:pureCounts, mixed:false, bands:null};
}
const cbmOf = d => d[0]*d[1]*d[2]/1e6;
function summarizeBands(bands){ const m={}; bands.forEach(b=>{ const k=b.join('×'); m[k]=(m[k]||0)+1; }); return Object.entries(m).map(([k,v])=>`${v} طبقة بمقاس ${k}`).join(' + '); }
const cbF = (v,d=4) => n(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function fitInfo(it, type){ // it: {l,w,h, realQty20, realQty40}
  const c=CBM_C[type], dims=[n(it.l),n(it.w),n(it.h)], ok=dims.every(x=>x>0);
  const fit = ok ? bestFit(dims,c.L,c.W,c.H) : {count:0,orient:null,mixed:false,bands:null};
  const real = it[type==='40'?'realQty40':'realQty20']; const isReal = real!==undefined && real!==null && real!=='';
  return { dims, ok, cbm: ok?cbmOf(dims):0, fit, isReal, count: isReal ? n(real) : fit.count };
}
// تقدير الحاوية لطلبية (بيستخدم في تاب الشحن)
function containerEstimate(rows, type){
  type=ctype(type); const c=CBM_C[type];
  const out=rows.map(r=>{ const f=fitInfo({l:r.L,w:r.W,h:r.H,realQty20:r.real20,realQty40:r.real40},type); return {...r, ...f, total:f.cbm*n(r.qty)}; });
  const cbm=sum(out,x=>x.total), fill=cbm/c.cbm*100;
  return { rows:out, cbm, fill, containers:Math.max(1,Math.ceil(fill/100-1e-9)), c, type, missing:out.filter(x=>!x.ok && n(x.qty)>0).length };
}
function cbGauge(cbm, type){
  const c=CBM_C[type], fill=cbm/c.cbm*100;
  const bar = fill<=100 ? 'linear-gradient(90deg,var(--navy),var(--good))' : 'linear-gradient(90deg,var(--gold-deep),var(--bad))';
  return `<div class="fill-gauge"><div class="fg-label"><span>نسبة الإشغال</span><span>${cbF(Math.min(fill,999),1)}%</span></div><div class="fg-track"><div class="fg-bar" style="width:${Math.min(fill,100)}%;background:${bar}"></div></div></div>`
    + (fill<=100 ? `<div class="verdict ok"><div>تكفي حاوية ${c.label} واحدة<div class="sub">المتبقي ${cbF(c.cbm-cbm,2)} م³ (${cbF(100-fill,1)}%)</div></div></div>`
                 : `<div class="verdict bad"><div>أكبر من حاوية ${c.label} واحدة<div class="sub">مطلوب ${cbF(cbm/c.cbm,2)} حاوية ${c.label}</div></div></div>`);
}

async function loadCartons(force){
  let rows = await DB.all('cartons', force).catch(()=>[]);
  if(!rows.length && (S.profile.role==='admin' || ['export','sales','production'].includes(S.profile.role))){
    let i=0; for(const [cat,list] of [['candy',SEED_CANDY],['snacks',SEED_SNACKS]]) for(const s of list){ const {qty,...d}=s; await DB.add('cartons',{...d,cat,seq:i++}); }

}

/* ---------------- توزيع الطلبية على أكتر من حاوية ----------------
   كل كرتونة بتاخد «جزء» من الحاوية = 1 ÷ سعة الحاوية من الصنف ده (الفعلي لو متسجل، وإلا النظري).
   - لو الكمية كلها تدخل في عدد الحاويات المختار: بنوزع الأصناف بحيث كل صنف يفضل في حاوية واحدة على قد ما نقدر (Best Fit)،
     وبنقسم الصنف على حاويتين بس لما يكون مفيش مكان يكفيه كله.
   - لو الكمية أكبر من الحاويات: بنقدّم الأصناف اللي كرتونتها أصغر (تاخد عدد كراتين أكتر) وبنقول اللي فاضل برة.
   - في الآخر: المساحة الفاضية في كل حاوية تكفي كام كرتونة زيادة من كل صنف. */
function cbPlan(list, type, N){
  const items=list.map(r=>{ const f=fitInfo(r,type); return {name:r.name, qty:Math.round(n(r.qty)), cap:f.count, frac:f.count>0?1/f.count:0, ok:f.ok&&f.count>0}; }).filter(x=>x.qty>0);
  const bad=items.filter(x=>!x.ok), good=items.filter(x=>x.ok), need=sum(good,x=>x.qty*x.frac);
  const E=1e-9, conts=Array.from({length:N},(_,i)=>({no:i+1, free:1, rows:[]}));
  // لو مش هتدخل كلها: نختار الكراتين الأصغر الأول عشان نطلع أكبر عدد
  let take=good.map(x=>({...x, put:x.qty}));
  const left=[];
  if(need>N+E){ let room=N; take=good.slice().sort((a,b)=>a.frac-b.frac).map(x=>{ const can=Math.min(x.qty, Math.floor((room+E)/x.frac)); room-=can*x.frac; if(can<x.qty) left.push({name:x.name, qty:x.qty-can}); return {...x, put:can}; }); }
  // 1) حاويات كاملة من صنف واحد (أسهل في التحميل وأدق في العدد)
  let ci=0; take.forEach(x=>{ if(x.put<=0) return; let full=Math.floor(x.put/x.cap); while(full>0 && ci<N){ conts[ci].rows.push({name:x.name, qty:x.cap, cap:x.cap}); conts[ci].free=0; ci++; full--; x.put-=x.cap; } });
  // 2) الباقي: Best Fit — الكمية الأكبر الأول، وكل صنف في حاوية واحدة على قد ما نقدر
  take.filter(x=>x.put>0).sort((a,b)=>b.put*b.frac-a.put*a.frac).forEach(x=>{
    let rem=x.put; const vol=rem*x.frac;
    const fits=conts.filter(c=>c.free+E>=vol).sort((a,b)=>a.free-b.free)[0];
    if(fits){ fits.rows.push({name:x.name, qty:rem, cap:x.cap}); fits.free-=vol; return; }
    for(const c of conts.slice().sort((a,b)=>b.free-a.free)){ if(rem<=0) break; const k=Math.min(rem, Math.floor((c.free+E)/x.frac)); if(k<=0) continue; c.rows.push({name:x.name, qty:k, cap:x.cap}); c.free-=k*x.frac; rem-=k; }
    if(rem>0) left.push({name:x.name, qty:rem});
  });
  const extra=c=>good.map(x=>({name:x.name, k:Math.floor((Math.max(0,c.free)+E)/x.frac)})).filter(e=>e.k>0).sort((a,b)=>b.k-a.k);
  return { conts, need, left, bad, extra, total:sum(conts,c=>sum(c.rows,r=>r.qty)) };
}

  const nC=k=>k===1?'حاوية واحدة':k===2?'حاويتين':k<=10?k+' حاويات':k+' حاوية'; const pct=v=>cbF(Math.max(0,Math.min(100,v*100)),0)+'%';
  return `<div class="panel cbp"><div class="cbp-h"><div><div class="panel-title" style="margin-bottom:4px">توزيع الأصناف على الحاويات</div>
      <div class="small muted">الكمية محتاجة حوالي <b>${cbF(need0,2)}</b> حاوية ${c.label} — يعني ${nC(sug)} ${c.label}.</div></div>
      ${noInput?`<div class="cbp-n"><span>موزعة على ${nC(N)}${CB.count?'':' (المقترح)'}</span></div>`:`<div class="cbp-n"><span>عدد الحاويات</span><input type="number" id="cb-n-cont" min="1" max="30" value="${N}"><span>× ${c.label}</span></div>`}</div>
    ${P.left.length?`<div class="verdict bad" style="font-size:13px"><div>الكمية أكبر من ${nC(N)} — اتحط أكبر عدد كراتين ممكن (${P.total.toLocaleString('en-US')} كرتونة)، والباقي برة:<div class="sub">${P.left.map(x=>`${esc(x.name)}: ${x.qty.toLocaleString('en-US')} كرتونة`).join(' — ')}</div></div></div>`
      :`<div class="verdict ok" style="font-size:13px"><div>الكمية كلها تدخل في ${nC(N)} ${c.label}${N>sug?` — وفي مكان زيادة عن المطلوب`:''}</div></div>`}
    ${P.bad.length?`<div class="small" style="color:var(--bad);margin:6px 0">مش محسوب (مقاس الكرتونة ناقص): ${P.bad.map(x=>esc(x.name)).join('، ')}</div>`:''}
    <div class="cbp-grid">${P.conts.map(k=>{ const used=1-k.free, ex=P.extra(k).slice(0,3);
      return `<div class="cbp-c"><div class="cbp-ct"><b>حاوية ${k.no}</b><span>${sum(k.rows,r=>r.qty).toLocaleString('en-US')} كرتونة · ${pct(used)}</span></div>
        <div class="fg-track"><div class="fg-bar" style="width:${Math.min(100,used*100)}%;background:linear-gradient(90deg,var(--navy),var(--good))"></div></div>
        ${k.rows.length?`<table class="cbp-t">${k.rows.map(r=>`<tr><td>${esc(r.name)}</td><td class="num">${r.qty.toLocaleString('en-US')}</td></tr>`).join('')}</table>`:'<div class="small muted" style="padding:8px 0">فاضية</div>'}
        ${k.rows.length&&ex.length&&k.free>0.03?`<div class="cbp-x">المكان الفاضي يكفي تقريبًا: ${ex.map(e=>`${e.k.toLocaleString('en-US')} من ${esc(e.name)}`).join(' أو ')}</div>`:''}</div>`; }).join('')}</div>
    <div class="small muted" style="margin-top:8px">الحساب تقريبي على أساس سعة الحاوية من كل صنف لوحده. الأصناف المقسومة على حاويتين بتبان في الحاويتين.</div></div>`;
}

/* ============================================================================
   الإجراء المطلوب لكل طلبية — زرار واحد في رأس الطلبية، وعمود في الرئيسية والطلبيات.
   ============================================================================ */
const ROLE_AR = {sales:'المبيعات', accounts:'الحسابات', production:'الإنتاج', export:'التصدير'};
function nextStep(o){
  if(!o || ['cancelled','closed'].includes(o.status)) return null;
  const pays=S.cache.payments||[], p=payCalc(o,pays), items=o.items||[], sh=o.shipment||{}, hs=(o.health||{}).status||'draft';
  const hDone = hs==='issued' || ['done','na'].includes(((o.docs||{}).health||{}).status);
  const pend = pays.some(x=>x.orderId===o.id && !x.confirmed && !x.void);
  const a = (title,tab,act,role) => ({title, tab, action:act||{tab}, role});
  const pay = what => pend ? a(`تأكيد استلام ${what}`,'payments',{tab:'payments'},'accounts')
                           : a(`تسجيل ${what}`,'payments',{js:`payForm(null,'${o.id}')`,perm:'payments.add'},'accounts');
  const itemsOk = items.length && items.every(it=>n(it.cartons)&&n(it.pricePerCarton)) && (o.customerId || (o.customer||{}).company);
  switch(o.status){
    case 'draft':
      return itemsOk ? a('تأكيد الطلبية','invoice',{adv:'confirmed'},'sales') : a('استكمال الفاتورة','invoice',null,'sales');
    case 'confirmed':
      return p.depositOk ? a('بدء الإنتاج','production',{adv:'production'},'export') : pay('المقدم');
    case 'production':
      return a('إنهاء الإنتاج','production',{adv:'ready'},'production');
    case 'ready': {
      if(orderCheckList(o).some(x=>!ckGet(o,x).done)) return a('مراجعة متطلبات البلد','docs',null,'export');
      if(!p.fullOk) return pay('باقي المبلغ');
      if(!hDone){ if(hs==='info') return a('استيفاء طلب الهيئة','health',null,'export');
        if(['draft','rejected'].includes(hs)) return a('طلب الشهادة الصحية','health',null,'export');
        return a('متابعة الشهادة الصحية','health',null,'export'); }
      if(!sh.containerNo || !sh.sealNo || (o.incoterm!=='EXW' && (!sh.bookingNo || !n(sh.vgmKg) || !sh.blNo))) return a('بيانات الشحن','shipping',null,'export');
      if(requiredDocs(o,S.cache.countries).some(k=>!['done','na'].includes(((o.docs||{})[k]||{}).status))) return a('استكمال المستندات','docs',null,'export');
      return a('تم الشحن','shipping',{adv:'shipped'},'export'); }
    case 'shipped':
      return sh.docsReleased ? a('إغلاق الطلبية','history',{adv:'closed'},'export') : a('تسليم المستندات للعميل','shipping',null,'export');
  }
  return null;
}
// زرار الإجراء في رأس الطلبية
function nextButton(o){
  const s=nextStep(o); if(!s) return '';
  const x=s.action;
  if(x.adv && !can('orders.status')) return '';
  if(x.perm && !can(x.perm) && S.profile.role!=='admin') return '';
  const on = x.adv?`advance('${x.adv}')` : x.js ? x.js : `odTab('${s.tab}')`;
  return `<button class="btn btn-a" onclick="${on}">${esc(s.title)}${x.adv?' '+IC.arrow:''}</button>`;
}
function myTasks(orders){
  const role=S.profile.role, all = role==='admin' || role==='export';
  return orders.map(o=>({o, s:nextStep(o)})).filter(x=>x.s && (all || x.s.role===role))
    .sort((a,b)=>(a.o.loadingDate||'9').localeCompare(b.o.loadingDate||'9'));
}

/* ============================================================================
   الشهادة الصحية — السيستم بيجهّز كل حاجة، وانت بتدوس إرسال، وهو بيتابع ويفكّرك.
   ١ جهّز: يشيك إن كل صنف عنده شهادة تحليل + نتيجة معمل سارية + تشغيلة
   ٢ ابعت: ملف الطلب + المرفقات + إيميل جاهز للهيئة ← «بعتّ الإيميل»
   ٣ تابع: سجل بكل اللي حصل، تنبيه لو الرد اتأخر، إيميل متابعة جاهز
   ٤ الشهادة: ارفعها برقمها وتاريخها ← المستندات تتعلم «اتعمل» لوحدها
   ============================================================================ */
const HS_LIST = ['draft','sent','info','issued','rejected'];
const HS_CLS = {draft:'b-gray',sent:'b-info',info:'b-warn',sampled:'b-yel',issued:'b-ok',rejected:'b-bad'};
const hcFollowDays = () => n(S.settings.healthFollowupDays)||3;
const daysSince = iso => iso ? -daysUntil(String(iso).slice(0,10)) : null;
function hcReadiness(o){
  const tests=hcTests(o), rows=(o.items||[]).map(it=>({it, batchOk:!!(it.batch&&it.prodDate)}));
  const expired=tests.filter(x=>testStatus(x,S.settings).state==='expired').length, missBatch=rows.filter(r=>!r.batchOk).length;
  return {tests, rows, expired, missBatch, missTests: tests.length?0:1, ready: tests.length>0 && !expired};
}

/* ============================================================================
   الحسابات والعمولات وملف الأوردر
   - السيلز والسوشيال ميديا: لكل شخص نسبة ثابتة، وتتغير في أوردر معين
   - العمولة بتستحق في الشهر اللي الأوردر اتدفع فيه بالكامل (على قيمة الفاتورة)
   - كشف حساب العميل: الفواتير والمدفوعات والرصيد
   ============================================================================ */
const TEAM_TYPES = {sales:'سيلز', social:'سوشيال ميديا'};
const teamOf = id => byId(S.cache.team, id);
// الشخص المسؤول: المختار في الأوردر، ولو أوردر قديم فيه اسم السيلز مكتوب بس بندوّر عليه بالاسم
const personId = (o, kind) => o[kind+'Id'] || (kind==='sales' && o.salesRep ? ((S.cache.team||[]).find(x=>x.type==='sales' && String(x.name).trim()===String(o.salesRep).trim())||{}).id||'' : '');
const orderPct = (o, kind) => (o[kind+'Pct']!=='' && o[kind+'Pct']!=null) ? n(o[kind+'Pct']) : n((teamOf(personId(o,kind))||{}).pct);
// الأوردر بيتحسب في الحسابات لو اتأكد، أو لو العميل دفع فيه فلوس حتى لو لسه مسودة
const isInvoiced = o => o && o.status!=='cancelled' && (o.status!=='draft' || (S.cache.payments||[]).some(p=>p.orderId===o.id && p.confirmed && !p.void));
const invDate = o => o.invoiceDate || o.piDate || String(o.createdAt||'').slice(0,10);
const custKey = o => o.customerId || ('n:'+((o.customer||{}).company||'').trim().toLowerCase());
// الدفعات المؤكدة بعملة الأوردر بس (زي payCalc) عشان الأرقام تبقى واحدة في كل الشاشات
const confPays = (oid, pays, cur) => (pays||S.cache.payments||[]).filter(p=>p.orderId===oid && p.confirmed && !p.void && (!cur || (p.currency||cur)===cur)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
function orderMoney(o, pays){
  const total=orderCalc(o).total, cp=confPays(o.id,pays,o.currency||'USD');
  const paid=sum(cp,p=>p.amount), received=sum(cp,p=>p.receivedAmount!=null&&p.receivedAmount!==''?p.receivedAmount:p.amount);
  const pending=sum((pays||S.cache.payments||[]).filter(p=>p.orderId===o.id && !p.confirmed && !p.void),p=>p.amount);
  let run=0, fullDate=null; for(const p of cp){ run+=n(p.amount); if(total>0 && run+0.005>=total){ fullDate=p.date; break; } }
  return {total, paid, received, charges:Math.max(0,paid-received), balance:Math.max(0,total-paid), pending, fullDate, cur:o.currency||'USD'};
}
function orderCommission(o, pays){
  const m=orderMoney(o,pays), out=[];
  ['sales','social'].forEach(k=>{ const id=personId(o,k); if(id){ const pct=orderPct(o,k); out.push({kind:k, id, name:(teamOf(id)||{}).name||'—', pct, amount:m.total*pct/100}); } });
  return {due: !!m.fullDate && isInvoiced(o), month: m.fullDate? m.fullDate.slice(0,7):'', date:m.fullDate, total:m.total, cur:m.cur, people:out};
}
const sumByCur = arr => { const r={}; arr.forEach(([c,v])=>{ r[c]=(r[c]||0)+n(v); }); return r; };
const fmtCur = r => Object.entries(r).filter(([,v])=>Math.abs(v)>0.004).map(([c,v])=>money(v,c)).join(' + ') || money(0);
const monthAr = ym => { if(!ym) return '—'; const [y,m]=ym.split('-'); return new Date(+y,+m-1,1).toLocaleDateString('ar-EG',{month:'long',year:'numeric'}); };

function orderFiles(o){
  const out=[], add=(fileId,group,label,extra={})=>{ if(fileId && !out.some(x=>x.fileId===fileId)) out.push({fileId,group,label,...extra}); };
  (o.files||[]).forEach((f,i)=>add(f.fileId,'ملفات الأوردر',f.label,{idx:i,at:f.at,by:f.by}));
  Object.entries(o.docs||{}).forEach(([k,d])=>add(d&&d.fileId,'المستندات',t('doc_'+k)));
  if((o.health||{}).fileId) add(o.health.fileId,'الشهادة الصحية','الشهادة الصحية');
  (S.cache.payments||[]).filter(p=>p.orderId===o.id && p.fileId && !p.void).forEach(p=>add(p.fileId,'الدفعات',`إثبات دفع ${money(p.amount,p.currency)} — ${fmtDate(p.date)}`));
  hcTests(o).forEach(x=>add(x.fileId,'التحاليل',`تحليل ${testName(x)}`));
  return out;
}

function customerBalances(){
  const map={};
  (S.cache.orders||[]).filter(isInvoiced).forEach(o=>{ const k=custKey(o), m=orderMoney(o);
    const c=map[k]=map[k]||{key:k, name:(o.customer||{}).company||'—', country:(o.customer||{}).country||'', orders:[], inv:{}, paid:{}, bal:{}, lastPay:'', oldest:null};
    c.orders.push(o); c.inv[m.cur]=(c.inv[m.cur]||0)+m.total; c.paid[m.cur]=(c.paid[m.cur]||0)+m.paid; c.bal[m.cur]=(c.bal[m.cur]||0)+m.balance;
    const lp=confPays(o.id).slice(-1)[0]; if(lp && lp.date>c.lastPay) c.lastPay=lp.date;
    if(m.balance>0.004 && ['shipped','closed'].includes(o.status)){ const d=daysSince((o.shipment||{}).shippedAt||invDate(o)); if(c.oldest===null||d>c.oldest) c.oldest=d; } });
  return Object.values(map);
}

function custMatch(o, key){ if(custKey(o)===key) return true; const c=byId(S.cache.customers,key); return !!c && !o.customerId && String((o.customer||{}).company||'').trim().toLowerCase()===String(c.company||'').trim().toLowerCase(); }
// كشف الحساب: من أول تعامل، أو فترة (من/إلى) برصيد أول المدة
function statementData(key, from='', to=''){
  const orders=(S.cache.orders||[]).filter(o=>isInvoiced(o) && custMatch(o,key)).sort((a,b)=>invDate(a).localeCompare(invDate(b)));
  const lines=[]; orders.forEach(o=>{ const m=orderMoney(o); lines.push({date:invDate(o), cur:m.cur, ref:o.number, o, desc:`فاتورة ${o.invoiceNo||o.piNumber||o.number}`, debit:m.total, credit:0});
    confPays(o.id).forEach(p=>lines.push({date:p.date, cur:p.currency||m.cur, ref:o.number, o, desc:`${t('pk2_'+p.kind)} — ${p.method==='cash'?t('cash'):t('transfer')}${p.reference?' '+p.reference:''}`, debit:0, credit:n(p.amount)})); });
  lines.sort((a,b)=>(a.date||'').localeCompare(b.date||'') || (b.debit-a.debit));
  const byCur={}; lines.forEach(l=>{ if(to && (l.date||'')>to) return; const c=byCur[l.cur]=byCur[l.cur]||{lines:[],bal:0,deb:0,cre:0,open:0};
    if(from && (l.date||'')<from){ c.open+=l.debit-l.credit; c.bal=c.open; return; }
    c.bal+=l.debit-l.credit; c.deb+=l.debit; c.cre+=l.credit; c.lines.push({...l, bal:c.bal}); });
  const c0=byId(S.cache.customers,key), cu=c0?{...((orders[0]||{}).customer||{}), ...c0}:((orders[0]||{}).customer||{});
  return {orders, byCur, cu, first:(lines[0]||{}).date||''};
}

function printCommissions(month){
  const all=(S.cache.orders||[]).filter(isInvoiced).map(o=>({o,c:orderCommission(o)})).filter(x=>x.c.due && x.c.month===month);
  const per={}; all.forEach(({o,c})=>c.people.forEach(p=>{ const r=per[p.id]=per[p.id]||{name:p.name,kind:p.kind,rows:[],tot:{}}; r.rows.push({o,c,p}); r.tot[c.cur]=(r.tot[c.cur]||0)+p.amount; }));
  const page=`<div dir="rtl" style="font-family:'Cairo',Arial,sans-serif;font-size:11px">
    <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #ffb607;padding-bottom:8px;margin-bottom:12px"><div><div style="font-size:18px;font-weight:800;color:#2d2a76">كشف العمولات</div><div style="color:#666">${monthAr(month)}</div></div><img src="${LOGO}" style="height:44px"></div>
    ${Object.values(per).map(r=>`<div style="font-weight:800;color:#2d2a76;margin:10px 0 4px">${esc(r.name)} — ${TEAM_TYPES[r.kind]}</div><table class="d-tbl"><thead><tr><th>الأوردر</th><th>العميل</th><th>قيمة الفاتورة</th><th>اكتمل الدفع</th><th>النسبة</th><th>العمولة</th></tr></thead><tbody>
      ${r.rows.map(({o,c,p})=>`<tr><td>${esc(o.number)}</td><td class="l">${esc(custName(o))}</td><td>${money(c.total,c.cur)}</td><td>${fmtDate(c.date)}</td><td>${fmt(p.pct,2)}%</td><td><b>${money(p.amount,c.cur)}</b></td></tr>`).join('')}
      <tr class="tot"><td colspan="5">الإجمالي</td><td>${fmtCur(r.tot)}</td></tr></tbody></table>`).join('')}
    <div class="d-sign"><div>الحسابات</div><div>المدير</div><div>المستلم</div></div></div>`;
  openPrint('عمولات '+month, [page]);
}

const SAMPLE_CLS = {prepared:'b-gray', sent:'b-info', delivered:'b-warn', ordered:'b-ok', closed:'b-gray'};
PAGES.samples = { tab:'samples', async render(){
  await Promise.all([DB.all('samples',true), DB.all('customers'), DB.all('team'), DB.all('products'), DB.all('files',true), DB.all('orders')]);
  $('view').innerHTML = pageHead(`<div class="row wrap">${searchBox('sm-q','بحث بالعميل أو البلد أو رقم الشحنة…','smList()')}
      <select class="in" id="sm-st" style="width:170px" onchange="smList()"><option value="">كل الحالات</option>${Object.entries(SAMPLE_ST).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>`,
      `<button class="btn btn-p" onclick="sampleForm()">${IC.plus} تسجيل عينة</button>`)
    + `<div class="mb" id="sm-kpi"></div><div class="card"><div class="tbl-wrap" id="sm-list"></div></div>`;
  smList();
}};
const smCust = x => x.customerName || (byId(S.cache.customers,x.customerId)||{}).company || '—';
function smList(){
  const q=($('sm-q').value||'').toLowerCase(), st=$('sm-st').value, all=S.cache.samples||[];
  const rows=all.filter(x=>(!st||x.status===st) && (!q||[smCust(x),x.country,x.city,x.tracking,x.courier].join(' ').toLowerCase().includes(q))).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const cost=sumByCur(all.map(x=>[x.currency||'USD',x.shippingCost])), back=sumByCur(all.filter(x=>x.paidBy==='customer').map(x=>[x.currency||'USD',x.customerPaid]));
  $('sm-kpi').innerHTML = stats([{k:'عدد العينات',v:all.length},{k:'تكلفة الشحن',v:fmtCur(cost)},{k:'دفعه العملاء',v:fmtCur(back)},{k:'اتحولت لأوردر',v:all.filter(x=>x.status==='ordered').length,cls:'hl'}]);
  $('sm-list').innerHTML = rows.length?`<table class="tbl"><thead><tr><th>التاريخ</th><th>العميل</th><th>رايحة فين</th><th>الأصناف</th><th>شركة الشحن</th><th>تكلفة الشحن</th><th>مين دفع الشحن</th><th>السيلز</th><th>الحالة</th><th></th></tr></thead><tbody>
    ${rows.map(x=>`<tr class="click" onclick="sampleForm('${x.id}')"><td class="num">${fmtDate(x.date)}</td><td class="bold">${esc(smCust(x))}</td><td>${esc(x.country||'')}<div class="tiny muted">${esc(x.city||'')}</div></td>
      <td class="small">${(x.items||[]).map(i=>`${esc(i.name)}${i.qty?` × ${fmt(i.qty)}`:''}`).join('<br>')||'—'}</td>
      <td class="small">${esc(x.courier||'')}<div class="tiny mono" dir="ltr">${esc(x.tracking||'')}</div></td><td class="num">${x.shippingCost?money(x.shippingCost,x.currency):'—'}</td>
      <td>${x.paidBy==='customer'?`<span class="bdg b-ok">العميل</span> <span class="num small">${money(x.customerPaid||0,x.currency)}</span>`:'<span class="bdg b-gray">الشركة</span>'}</td>
      <td class="small">${esc((teamOf(x.salesId)||{}).name||'—')}</td><td><span class="bdg ${SAMPLE_CLS[x.status]||'b-gray'}">${SAMPLE_ST[x.status]||''}</span></td>
      <td class="act">${(x.files||[]).length?`<span class="tiny muted">${IC.file} ${x.files.length}</span>`:''}</td></tr>`).join('')}</tbody></table>`:emptyBox('لا توجد عينات');
}
function sampleForm(id){
  const x=byId(S.cache.samples,id)||{date:todayISO(), status:'prepared', paidBy:'us', currency:'USD', items:[], files:[]};
  let items=(x.items||[]).map(i=>({...i})), files=[...(x.files||[])];
  const custOpts=[['','— عميل جديد / غير مسجل —'],...(S.cache.customers||[]).map(c=>[c.id,c.company+(c.country?' — '+c.country:'')])];
  const prods=(S.cache.products||[]).map(p=>p.nameAr||p.nameEn).filter(Boolean);
  const bg=openModal({title:id?'العينة':'تسجيل عينة', body:`<div class="grid g3" id="smf">
      ${fld('التاريخ','date',x.date,{type:'date',req:1})}${fld('العميل','customerId',x.customerId||'',{opts:custOpts})}${fld('اسم العميل (لو مش مسجل)','customerName',x.customerName||'')}
      ${fld('البلد','country',x.country||'',{req:1,attrs:'list="sm-cl"'})}${fld('المدينة / العنوان','city',x.city||'')}${fld('السيلز','salesId',x.salesId||'',{opts:[['','—'],...teamOpts('sales'),...teamOpts('social')]})}
      ${fld('شركة الشحن','courier',x.courier||'',{ph:'DHL / Aramex / FedEx'})}${fld('رقم الشحنة','tracking',x.tracking||'')}${fld('الحالة','status',x.status,{opts:Object.entries(SAMPLE_ST)})}
      ${fld('تكلفة الشحن','shippingCost',x.shippingCost??'',{type:'number'})}${fld(t('currency'),'currency',x.currency,{opts:CURRENCIES})}${fld('مين دفع الشحن','paidBy',x.paidBy,{opts:[['us','الشركة'],['customer','العميل']]})}
      ${fld('المبلغ اللي دفعه العميل','customerPaid',x.customerPaid??'',{type:'number'})}${fld('الوزن (كجم)','weightKg',x.weightKg??'',{type:'number'})}${fld('الأوردر الناتج','orderId',x.orderId||'',{opts:[['','—'],...(S.cache.orders||[]).map(o=>[o.id,o.number+' — '+custName(o)])]})}
      <div class="field full"><label>الأصناف</label><div id="smf-it"></div><button type="button" class="btn btn-o btn-s mt-s" id="smf-add">${IC.plus} صنف</button></div>
      <div class="field full"><label>الملفات (بوليصة الشحن، صور، فاتورة الشحن)</label><div class="row wrap" id="smf-fl"></div><button type="button" class="btn btn-o btn-s mt-s" id="smf-up">${IC.upload} رفع ملف</button></div>
      ${fld(t('notes'),'notes',x.notes||'',{type:'textarea',cls:'full'})}</div>
      <datalist id="sm-cl">${COUNTRY_NAMES().map(c=>`<option value="${esc(c)}">`).join('')}</datalist><datalist id="sm-pl">${prods.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>`,
    foot:`${id&&isAdmin()?`<button class="btn btn-d" id="smf-del" style="margin-inline-end:auto">${IC.trash}</button>`:''}<button class="btn btn-o" onclick="closeModal()">${t('cancel')}</button><button class="btn btn-p" id="smf-s">${t('save')}</button>`});
  const q=s=>bg.querySelector(s);
  const drawIt=()=>{ q('#smf-it').innerHTML=items.map((i,k)=>`<div class="row mb-s"><input class="in grow" list="sm-pl" data-k="${k}" data-f="name" value="${esc(i.name||'')}" placeholder="الصنف"><input class="in" type="number" data-k="${k}" data-f="qty" value="${i.qty??''}" placeholder="الكمية" style="width:100px"><button type="button" class="btn btn-g btn-xs" data-rm="${k}">${IC.x}</button></div>`).join('');
    q('#smf-it').querySelectorAll('[data-f]').forEach(el=>el.oninput=()=>{ items[el.dataset.k][el.dataset.f]= el.type==='number'?n(el.value):el.value; });
    q('#smf-it').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ items.splice(+b.dataset.rm,1); drawIt(); }); };
  const drawFl=()=>{ q('#smf-fl').innerHTML=files.map(f=>filePillSync(f)).join('')||'<span class="small muted">—</span>'; };
  drawIt(); drawFl();
  q('#smf-add').onclick=()=>{ items.push({name:'',qty:''}); drawIt(); };
  q('#smf-up').onclick=async ()=>{ const f=await pickFile('.pdf,.jpg,.jpeg,.png'); if(!f) return; toast(t('uploading')); try{ const fid=await FILES.upload(f,{col:'samples',id:id||''}); await DB.all('files',true); files.push(fid); drawFl(); }catch(e){ errToast(e); } };
  const cs=q('[name=customerId]'); cs.onchange=()=>{ const c=byId(S.cache.customers,cs.value); if(c){ q('[name=country]').value=c.country||''; q('[name=customerName]').value=''; } };
  const del=q('#smf-del'); if(del) del.onclick=async ()=>{ if(!await confirmBox(t('del_q'),{danger:1})) return; await DB.del('samples',id); closeModal(bg); smList(); };
  q('#smf-s').onclick=async ()=>{ const f=readForm(q('#smf')); if(!f.date||!f.country||(!f.customerId&&!f.customerName)){ toast(t('fill_required'),'bad'); return; }
    f.items=items.filter(i=>i.name); f.files=files; if(f.paidBy!=='customer') f.customerPaid='';
    try{ if(id) await DB.update('samples',id,f); else await DB.add('samples',{...f, by:who()}); closeModal(bg); toast(t('saved'),'ok'); await DB.all('samples',true); smList(); }catch(e){ errToast(e); } };
}

function worldCountryRec(w){ const d=REGION_DEF[w.r]||REGION_DEF.x, e=COUNTRY_EXTRA[w.name]||{};

async function seedWorldCountries(silent){
  const have=new Set((await DB.all('countries',true)).flatMap(c=>[c.name,c.nameAr].map(x=>String(x||'').trim().toLowerCase())));
  const todo=WORLD.filter(w=>!have.has(w.name.toLowerCase()) && !have.has(w.nameAr.toLowerCase()));
  if(!todo.length){ if(!silent) toast('كل الدول موجودة','ok'); return 0; }
  if(!silent && !await confirmBox(`إضافة ${todo.length} دولة بالمتطلبات الأساسية حسب المنطقة؟`)) return 0;
  if(!silent) toast('جاري الإضافة…');
  for(const w of todo) await DB.add('countries', worldCountryRec(w));
  await DB.all('countries',true); if(!silent){ toast(`تمت إضافة ${todo.length} دولة`,'ok'); ctryList(); }
  return todo.length;
}

const hcCertName = o => `نموذج الشهادة الصحية - ${o.number}.docx`;

/* ---------- ملء نموذج Word ---------- */
const xRep = (x, a, b) => { const i=x.indexOf(a); return i<0 ? x : x.slice(0,i)+b+x.slice(i+a.length); };
const xEsc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// يكتب قيمة في خلية جدول: أول جزء نص ياخد القيمة والباقي يتشال (التنسيق بيفضل زي ما هو)
function xCell(tc, val){
  let first=true;
  const out=tc.replace(/<w:r(?: [^>]*)?>(?:(?!<\/w:r>)[\s\S])*?<w:t(?: [^>]*)?>[\s\S]*?<\/w:t>[\s\S]*?<\/w:r>/g, r=>{ if(!first) return ''; first=false;
    return r.replace(/<w:t(?: [^>]*)?>[\s\S]*?<\/w:t>/, ()=>`<w:t xml:space="preserve">${xEsc(val)}</w:t>`); });
  if(!first || val==='' || val==null) return out;
  const rpr=(tc.match(/<w:pPr>[\s\S]*?(<w:rPr>[\s\S]*?<\/w:rPr>)[\s\S]*?<\/w:pPr>/)||[])[1]||'';
  return out.replace(/<\/w:p>/, ()=>`<w:r>${rpr}<w:t xml:space="preserve">${xEsc(val)}</w:t></w:r></w:p>`);
}
const xCells = tr => tr.match(/<w:tc>[\s\S]*?<\/w:tc>/g)||[];
const xSetCells = (tr, fn) => { let i=0; return tr.replace(/<w:tc>[\s\S]*?<\/w:tc>/g, tc=>fn(tc, i++)); };
const xText = s => (s.match(/<w:t(?: [^>]*)?>[\s\S]*?<\/w:t>/g)||[]).map(t=>t.replace(/<[^>]+>/g,'')).join('');
async function hcCertBlob(C){
  if(!window.JSZip) throw new Error('JSZip not loaded');
  const zip=await JSZip.loadAsync(HC_TPL,{base64:true}); let x=await zip.file('word/document.xml').async('string');
  const trs=x.match(/<w:tr[ >][\s\S]*?<\/w:tr>/g);
  const find=f=>trs.findIndex(f);
  // المرسل إليه
  const iCons=find(tr=>xText(tr).includes('المرسل اليه'));
  x=xRep(x, trs[iCons], trs[iCons].replace(/(<w:t(?: [^>]*)?>)\s*شركة شوب دوت شيب تريدينغ\s*(<\/w:t>)/, (m,a,b)=>a+xEsc(C.consigneeName)+b).replace(/(<w:t(?: [^>]*)?>)\s*قطر\s*(<\/w:t>)/, (m,a,b)=>a+xEsc(C.consigneeAddr)+b));
  // وسيلة النقل: علامة ✓ في الخانة المختارة (جوي / بحري / بري)
  const iTr=find(tr=>xText(tr).includes('By Air')), iMark=iTr+1;
  const cells=xCells(trs[iMark]), chk=(cells[8].match(/<w:r(?: [^>]*)?>(?:(?!<\/w:r>)[\s\S])*?✓[\s\S]*?<\/w:r>/)||[''])[0];
  const pos={air:6, sea:7, road:8}[C.transport||'sea'];
  x=xRep(x, trs[iMark], xSetCells(trs[iMark], (tc,i)=>{ if(i<6||i>8) return tc; const clean=tc.replace(/<w:r(?: [^>]*)?>[\s\S]*?<\/w:r>/g,''); return i===pos ? clean.replace(/<\/w:p>/, ()=>chk+'</w:p>') : clean; }));
  // ميناء المغادرة وبلد الوصول
  const iPort=find(tr=>xText(tr).includes('ميناء المغادرة'));
  x=xRep(x, trs[iPort], xSetCells(trs[iPort], (tc,i)=> i===1 ? xCell(tc, C.loadingPort) : i===4 ? xCell(tc, C.destPort) : tc.replace(/(<w:t(?: [^>]*)?>)ll(<\/w:t>)/,'$1$2')));
  // جدول المنتجات: أول سطر بيتكرر لكل منتج
  const iHead=find(tr=>xText(tr).includes('رقم الشغيلة')), iEnd=find(tr=>xText(tr).includes('Certificate of Conformity'));
  const tpl=trs[iHead+1], keys=['name','hs','treat','brand','prod','exp','pkgs','batch','weight','unit'];
  const rows=(C.rows&&C.rows.length?C.rows:[{}]).map((r,ri)=>xSetCells(tpl,(tc,i)=> i===0 ? xCell(tc, String(ri+1)) : xCell(tc, r[keys[i-1]]??''))).join('');
  const a=x.indexOf(trs[iHead+1]), b=x.indexOf(trs[iEnd]);
  x=x.slice(0,a)+rows+x.slice(b);
  // الكلام كان أصفر في النموذج — يرجع أسود
  x=x.replace(/<w:color w:val="FFFF00"\/>/g,'<w:color w:val="000000"/>').replace(/<w:highlight w:val="yellow"\/>/g,'');
  zip.file('word/document.xml', x);
  return zip.generateAsync({type:'blob', compression:'DEFLATE', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

/* ============================================================================
   مكتبة التحاليل: كل شهادات التحليل (لكل طعم) متخزنة مرة واحدة،
   وفي كل أوردر بنختار منها اللي هتتبعت مع نموذج الشهادة الصحية.
   ============================================================================ */
const testName = x => x ? (x.name || prodName(byId(S.cache.products,x.productId)) || 'تحليل') : '';
const normTxt = s => String(s||'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[^\p{L}\p{N} ]/gu,' ').replace(/\s+/g,' ').trim();
function pickFiles(accept='.pdf,.jpg,.jpeg,.png'){ return new Promise(res=>{ const i=document.createElement('input'); i.type='file'; i.multiple=true; i.accept=accept; i.onchange=()=>res([...i.files]); i.click(); }); }

// رفع أكتر من تحليل مرة واحدة، وبعدها شاشة لتسمية كل واحد
async function testsBulkUpload(onDone){
  const fs=await pickFiles(); if(!fs.length) return;
  const ids=[];
  try{ for(const [i,f] of fs.entries()){ toast(`جاري الرفع ${i+1} من ${fs.length}…`);
      const fid=await FILES.upload(f,{col:'tests'});
      ids.push(await DB.add('tests',{name:f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').trim(), productId:'', kind:'test_cert', lab:'QCAP — وزارة الزراعة', testDate:todayISO(), reportNo:'', fileId:fid})); }
    await Promise.all([DB.all('tests',true), DB.all('files',true)]);
  }catch(e){ errToast(e); }
  if(ids.length) testsRename(ids, onDone);
}
function testsRename(ids, onDone){
  const rows=ids.map(id=>byId(S.cache.tests,id)).filter(Boolean);
  const bg=openModal({title:`تسمية التحاليل (${rows.length})`, size:'lg', body:`<div class="small muted mb">اكتبي اسم الطعم زي ما هو في الشهادة (Variety)، ورقم الشهادة وتاريخها.</div>

    ${rows.map(x=>`<tr data-id="${x.id}"><td>${filePillSync(x.fileId)}</td><td><input class="in sm" data-f="name" value="${esc(x.name)}" style="min-width:220px"></td><td><input class="in sm" data-f="reportNo" value="${esc(x.reportNo||'')}" placeholder="Dokki-469707" dir="ltr"></td><td><input class="in sm" type="date" data-f="testDate" value="${esc(x.testDate||'')}"></td></tr>`).join('')}</tbody></table></div>`,
    foot:`<button class="btn btn-p" id="tr-s">${t('save')}</button>`});
  bg.querySelector('#tr-s').onclick=async ()=>{ try{ for(const tr of bg.querySelectorAll('tr[data-id]')){ const p={}; tr.querySelectorAll('[data-f]').forEach(i=>p[i.dataset.f]=i.value.trim()); await DB.update('tests',tr.dataset.id,p); }
      await DB.all('tests',true); closeModal(bg); toast(t('saved'),'ok'); onDone? onDone(ids) : route(); }catch(e){ errToast(e); } };
}

// المقترح: التحاليل المربوطة بمنتجات الأوردر، أو اللي اسمها شبه اسم صنف في الأوردر
function hcSuggest(o){
  const items=o.items||[], names=items.flatMap(it=>[it.nameAr,it.nameEn]).map(normTxt).filter(Boolean);
  return (S.cache.tests||[]).filter(x=>{ if(x.productId && items.some(it=>it.productId===x.productId)) return true;
    const nm=normTxt(x.name); return nm.length>2 && names.some(n2=>n2.includes(nm)||nm.includes(n2)); }).map(x=>x.id);
}
const hcTestIds = o => { const h=o.health||{}; return (Array.isArray(h.testIds)? h.testIds : hcSuggest(o)).filter(id=>byId(S.cache.tests,id)); };
const hcTests = o => hcTestIds(o).map(id=>byId(S.cache.tests,id));
function hcPickTests(){
  const o=OD.o; let sel=new Set(hcTestIds(o)); const sug=new Set(hcSuggest(o));
  const bg=openModal({title:'اختيار التحاليل', size:'lg', body:`<div class="pp">
      <div class="row"><div class="search pp-s grow">${IC.search}<input class="in" id="hp-q" placeholder="ابحث باسم الطعم… (مثلًا: فراخ، Hot Chicken)" autocomplete="off"></div>${can('tests.edit')?`<button class="btn btn-o" id="hp-up">${IC.upload} رفع تحاليل جديدة</button>`:''}</div>

      <div class="pp-list" id="hp-list"></div></div>`,
    foot:`<span class="small muted" id="hp-n" style="margin-inline-end:auto"></span><button class="btn btn-o" onclick="closeModal()">${t('cancel')}</button><button class="btn btn-p" id="hp-ok">${t('save')}</button>`});
  const q=s=>bg.querySelector(s); let onlySel=false;
  const draw=()=>{ const w=normTxt(q('#hp-q').value);
    const rows=(S.cache.tests||[]).filter(x=>(!onlySel||sel.has(x.id)) && (!w||normTxt([testName(x),x.reportNo].join(' ')).includes(w))).sort((a,b)=>(sel.has(b.id)-sel.has(a.id))||(sug.has(b.id)-sug.has(a.id))||testName(a).localeCompare(testName(b),'ar'));
    q('#hp-list').innerHTML = rows.length?`<table class="tbl pp-t"><thead><tr><th></th><th>الاسم / الطعم</th><th>رقم الشهادة</th><th>التاريخ</th><th>الصلاحية</th><th></th></tr></thead><tbody>
      ${rows.map(x=>{ const s=testStatus(x,S.settings); return `<tr class="click ${sel.has(x.id)?'pp-in':''}" data-id="${x.id}"><td><input type="checkbox" ${sel.has(x.id)?'checked':''} style="width:17px;height:17px;accent-color:var(--navy)"></td>
        <td class="bold">${esc(testName(x))} ${sug.has(x.id)?'<span class="bdg b-navy nodot">مقترح</span>':''}</td><td class="mono small">${esc(x.reportNo||'')}</td><td class="num">${fmtDate(x.testDate)}</td><td>${s.until?`<span class="bdg ${s.state==='expired'?'b-bad':s.state==='soon'?'b-warn':'b-ok'}">${t('ts_'+s.state)}</span>`:'—'}</td>
        <td class="act" onclick="event.stopPropagation()">${x.fileId?`<button class="btn btn-g btn-xs" onclick="FILES.open('${x.fileId}')">فتح</button>`:''}</td></tr>`; }).join('')}</tbody></table>`
      : emptyBox((S.cache.tests||[]).length?'لا توجد نتائج':'مكتبة التحاليل فاضية — ارفعي التحاليل الأول');

/* ============================================================================
   الإرسال من السيستم عن طريق Gmail (بالمرفقات)
   - بيستخدم حساب Gmail اللي بيدخل بيه المستخدم (أول مرة جوجل بيسأل عن الإذن)
   - محتاج Google Client ID مرة واحدة في الإعدادات
   ============================================================================ */
const GM_SCOPE = 'https://www.googleapis.com/auth/gmail.send';
let GM_TOKEN = null; // {token, exp}
const gmReady = () => !!(S.settings.googleClientId||'').trim();
function gmLoadLib(){ return window.google && google.accounts && google.accounts.oauth2 ? Promise.resolve() : new Promise((res,rej)=>{
  const s=document.createElement('script'); s.src='https://accounts.google.com/gsi/client'; s.async=true; s.onload=()=>res(); s.onerror=()=>rej(new Error('تعذر تحميل خدمة جوجل — اتأكدي من الإنترنت')); document.head.appendChild(s); }); }
async function gmToken(){
  if(GM_TOKEN && GM_TOKEN.exp>Date.now()+60000) return GM_TOKEN.token;
  await gmLoadLib();
  return new Promise((res,rej)=>{
    const tc=google.accounts.oauth2.initTokenClient({ client_id:S.settings.googleClientId.trim(), scope:GM_SCOPE,
      callback:r=>{ if(r.error){ rej(new Error(r.error_description||r.error)); return; } GM_TOKEN={token:r.access_token, exp:Date.now()+(n(r.expires_in)||3500)*1000}; res(r.access_token); },
      error_callback:e=>rej(new Error(e && e.type==='popup_closed' ? 'اتقفلت نافذة جوجل قبل الموافقة' : (e&&e.message)||'تعذر الدخول على Gmail')) });
    tc.requestAccessToken({prompt:''});
  });
}
// بناء الإيميل (MIME) بالمرفقات
const b64u8 = s => btoa(unescape(encodeURIComponent(s)));
const wrap76 = s => s.replace(/.{1,76}/g, m=>m+'\r\n');
async function blobB64(blob){ const buf=new Uint8Array(await blob.arrayBuffer()); let bin=''; for(let i=0;i<buf.length;i+=0x8000) bin+=String.fromCharCode.apply(null, buf.subarray(i,i+0x8000)); return btoa(bin); }
const encWord = s => /^[\x20-\x7e]*$/.test(s) ? s : `=?UTF-8?B?${b64u8(s)}?=`;
async function gmBuild({to, cc, subject, body, files}){
  const bd='egf_'+uid();
  let m = `To: ${to}\r\n${cc?`Cc: ${cc}\r\n`:''}Subject: ${encWord(subject)}\r\nMIME-Version: 1.0\r\nContent-Type: multipart/mixed; boundary="${bd}"\r\n\r\n`
    + `--${bd}\r\nContent-Type: text/plain; charset="UTF-8"\r\nContent-Transfer-Encoding: base64\r\n\r\n${wrap76(b64u8(body))}`;
  for(const f of files){ const type=f.blob.type||'application/octet-stream';
    m += `--${bd}\r\nContent-Type: ${type}; name="${encWord(f.name)}"\r\nContent-Disposition: attachment; filename="${encWord(f.name)}"; filename*=UTF-8''${encodeURIComponent(f.name)}\r\nContent-Transfer-Encoding: base64\r\n\r\n${wrap76(await blobB64(f.blob))}`; }
  return m + `--${bd}--\r\n`;
}
async function gmSend(msg){
  const token=await gmToken(), raw=await gmBuild(msg);
  const r=await fetch('https://gmail.googleapis.com/upload/gmail/v1/users/me/messages/send?uploadType=media',{method:'POST', headers:{Authorization:'Bearer '+token,'Content-Type':'message/rfc822'}, body:raw});
  if(!r.ok){ let e=''; try{ e=(await r.json()).error.message; }catch(_){ e=r.statusText; } if(r.status===401) GM_TOKEN=null; throw new Error('Gmail: '+e); }
  return r.json();
}
const fmtSize = b => b>1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(b/1024))+' KB';

/* ============================================================================
   Packing List — نفس شكل الـ Packing List في سيستم الـ ERP التاني،
   بس بيتملي لوحده من الأوردر (الكميات المحمّلة فعلًا) ويتعدل قبل الطباعة.
   صافي الكرتونة = وزن العبوة (جم) × العبوات في الكرتونة ÷ 1000
   ============================================================================ */
function plFromOrder(o){
  return (o.items||[]).map(it=>{ const c=itemCalc(it);
    return { product: it.nameEn||it.nameAr||'', flavor:(it.flavours||[]).join(', '), cartons: c.loaded||'', weightG: unitGrams(it)||'', units: n(it.unitsPerCarton)||'',
      grossW: n(it.cartonGrossKg) ? round(n(it.cartonGrossKg),3) : '' }; });
}
const plNetCtn = r => (n(r.weightG) && n(r.units)) ? n(r.weightG)*n(r.units)/1000 : 0;
const plF = (v,d) => v ? n(v).toFixed(d) : '';
/* ---------- صفحة Packing List (تابة لوحدها في القايمة) ---------- */
// التخزين: كولكشن packing — {customer, date, po, orderId?, containerNo, rows}
const PL_EMPTY_ROW = () => ({product:'',flavor:'',cartons:'',weightG:'',units:'',grossW:''});
PAGES.packing = { tab:['packing','orders'], title:'pg_packing', async render([id, oid]){
  await Promise.all([DB.all('packing',true).catch(()=>[]), DB.all('orders',true), DB.all('products')]);
  if(!id) return plListPage();
  let P;
  if(id==='order'){ const o=byId(S.cache.orders,oid); if(!o){ $('view').innerHTML=emptyBox(t('not_found')); return; }
    const ex=(S.cache.packing||[]).find(x=>x.orderId===oid);
    if(ex){ location.replace('#/packing/'+ex.id); return; }
    P=plNewFromOrder(o); }
  else if(id==='new') P={customer:'', date:todayISO(), po:'', orderId:'', containerNo:'', rows:[PL_EMPTY_ROW()]};
  else { const x=byId(S.cache.packing,id); if(!x){ $('view').innerHTML=emptyBox(t('not_found')); return; } P=JSON.parse(JSON.stringify(x)); }
  plEditor(P);
}};
function plNewFromOrder(o){ const sv=o.packingList||{};
  return {customer: sv.customer ?? custName(o), date: sv.date || o.invoiceDate || todayISO(), po: sv.po ?? (o.piNumber||o.number), orderId:o.id, orderNo:o.number, containerNo:(o.shipment||{}).containerNo||'',
    rows: (sv.rows&&sv.rows.length) ? sv.rows : plFromOrder(o)}; }
function plTotals(P){ let c=0,nt=0,g=0; (P.rows||[]).forEach(r=>{ const k=n(r.cartons); c+=k; nt+=plNetCtn(r)*k; g+=n(r.grossW)*k; }); return {c,nt,g}; }
function plListPage(){
  const rows=(S.cache.packing||[]).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));

    <table class="plx-main"><thead><tr><th>Product / Flavor</th><th>carton<br>number</th><th>Weight (g)<br>per unit</th><th>Units<br>per carton</th><th>Net weight<br>carton</th><th>Total Net<br>weight</th><th>Gross<br>Weight</th><th>Total Gross<br>Weight</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr class="plx-tot"><td>Total</td><td>${fmt(tc)}</td><td></td><td></td><td></td><td>${tn.toFixed(2)}</td><td></td><td>${tg.toFixed(2)}</td></tr></tfoot></table>
    <table class="plx-foot"><tr><td colspan="3">Address: &nbsp; ${esc(s.address||'')}</td></tr>
      <tr><td>TEL: &nbsp; ${esc(s.phone||'')}</td><td>E-mail: &nbsp; ${esc(s.email||'')}</td><td>Web site: &nbsp; ${esc(s.website||'')}</td></tr></table></div>`;
  openPrint(`Packing List ${P.customer||''}`, [page]);
}

boot();
</script>
